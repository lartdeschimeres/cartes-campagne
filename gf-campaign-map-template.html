<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Grimdark Future — Carte de campagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onerror = function(){
    var fallback = document.createElement('script');
    fallback.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    document.head.appendChild(fallback);
  };
  document.head.appendChild(s);
})();
</script>
<style>
  :root{
    --bg: #0b0d0e;
    --panel: rgba(18,20,20,0.72);
    --line: rgba(150,175,175,0.28);
    --ink: #d7e4e2;
    --dim: #a8bab7;
    --accent: #6fd8c9;
    --accent-dim: rgba(111,216,201,0.35);
    --danger: #c94b4b;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Share Tech Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#000;
    font-family:var(--font-display);
    color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; padding:24px 24px 180px 24px;
  }
  .sheet{
    width:1600px; max-width:100%; aspect-ratio:16/9.2;
    background:var(--bg);
    position:relative; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 6px #000, 0 0 60px rgba(0,0,0,0.8);
  }
  .sheet::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  }
  .terrain-slot{
    position:absolute; inset:0; z-index:1; overflow:hidden;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    text-align:center; cursor:pointer;
    filter: grayscale(0.5) contrast(1.05);
  }
  .terrain-slot img{width:100%; height:100%; object-fit:contain; transform-origin:center center; cursor:grab;}
  .terrain-slot img:active{cursor:grabbing;}
  .terrain-slot .hint{
    color:var(--dim); font-size:15px; letter-spacing:2px; text-transform:uppercase;
    border:1px dashed var(--line); padding:22px 34px; font-family:var(--font-body);
  }
  .terrain-slot input{display:none;}

  .grid-overlay{
    position:absolute; inset:0; z-index:2; pointer-events:none; display:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.12) 0, rgba(255,255,255,0.12) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.12) 0, rgba(255,255,255,0.12) 1px, transparent 1px, transparent 40px);
  }
  .grid-overlay.visible{ display:block; }
  .sheet.exporting .grid-overlay{ display:none !important; }
  .map-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .map-marker{
    position:absolute; width:32px; height:32px; transform:translate(-50%,-50%);
    border:1px solid var(--accent-dim); border-radius:4px; background-color:rgba(11,13,14,0.4);
    cursor:grab; touch-action:none; background-size:cover; background-position:center; background-repeat:no-repeat;
    pointer-events:auto;
  }
  .map-marker:active{cursor:grabbing;}
  .map-marker .row-remove{opacity:0; top:-8px; right:-8px; width:20px; height:20px; background:rgba(11,13,14,0.85); border-radius:50%;}
  .map-marker:hover .row-remove{opacity:0.9;}
  .map-marker.has-icon{ border-color:transparent; background-color:transparent; }
  .map-marker .resize-handle{
    position:absolute; right:-3px; bottom:-3px; width:10px; height:10px;
    background:var(--accent); border:1px solid #0a0e12; cursor:nwse-resize;
    opacity:0; transition:opacity 0.15s; z-index:3;
  }
  .map-marker:hover .resize-handle{opacity:0.9;}
  .resize-handle:hover{opacity:1 !important;}
  .map-marker .rotate-handle{
    position:absolute; top:-22px; left:50%; transform:translateX(-50%);
    width:10px; height:10px; border-radius:50%; background:var(--accent);
    border:1px solid #0a0e12; cursor:grab; opacity:0; transition:opacity 0.15s; z-index:3;
  }
  .map-marker:hover .rotate-handle{opacity:0.9;}
  .rotate-handle:hover{opacity:1 !important;}
  .map-marker .skew-handle{
    position:absolute; left:-6px; bottom:-6px; width:9px; height:9px;
    background:var(--accent); border:1px solid #0a0e12; cursor:ew-resize;
    opacity:0; transition:opacity 0.15s; z-index:3; transform:rotate(45deg);
  }
  .map-marker:hover .skew-handle{opacity:0.9;}
  .skew-handle:hover{opacity:1 !important;}
  .arrow-layer{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .arrow-path{ fill:none; vector-effect:non-scaling-stroke; transform-box:fill-box; transform-origin:center; pointer-events:stroke; cursor:grab; }
  .arrow-path.layer-hidden{ pointer-events:none; }
  .arrow-curve-handle{
    display:none; position:absolute; width:11px; height:11px; border-radius:50%;
    background:var(--danger); border:1px solid #0a0e12; cursor:move;
    transform:translate(-50%,-50%); z-index:4; pointer-events:auto; opacity:0.65; transition:opacity 0.15s;
  }
  .arrow-curve-handle.active{ display:block; }
  .arrow-curve-handle:hover{opacity:1;}
  .arrow-path.standard{ stroke:var(--accent); stroke-width:4; }
  .arrow-path.double{ stroke:var(--accent); stroke-width:4; }
  .arrow-path.dashed{ stroke:var(--accent); stroke-width:3; stroke-dasharray:14 10; }
  .arrow-path.bold{ stroke:var(--danger); stroke-width:8; }
  .arrow-path.curve{ stroke:var(--accent); stroke-width:3; stroke-dasharray:1 8; stroke-linecap:round; }
  .arrow-path.layer-hidden{ display:none !important; }
  .arrow-handle{
    position:absolute; width:14px; height:14px; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--accent); border:2px solid #0a0e12;
    cursor:grab; z-index:4; pointer-events:auto; opacity:0.7; transition:opacity 0.15s;
  }
  .arrow-handle:hover{opacity:1;}
  .arrow-handle:active{cursor:grabbing;}
  .arrow-handle .row-remove{opacity:0; top:-8px; right:-8px; width:20px; height:20px; background:rgba(11,13,14,0.85); border-radius:50%;}
  .arrow-handle:hover .row-remove{opacity:0.9;}
  .arrow-rotate-handle{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background:var(--accent); border:1px solid #0a0e12; cursor:grab;
    transform:translate(-50%, calc(-50% - 22px)); z-index:4; pointer-events:auto;
    opacity:0.55; transition:opacity 0.15s;
  }
  .arrow-rotate-handle:hover{opacity:1;}
  .arrow-skew-handle{
    position:absolute; width:10px; height:10px;
    background:var(--accent); border:1px solid #0a0e12; cursor:ew-resize;
    transform:translate(-50%, calc(-50% + 22px)) rotate(45deg); z-index:4; pointer-events:auto;
    opacity:0.55; transition:opacity 0.15s;
  }
  .arrow-skew-handle:hover{opacity:1;}
  .map-label{
    position:absolute; transform:translate(-50%,-50%); z-index:4; pointer-events:auto;
    min-width:20px; max-width:320px; padding:2px 8px;
    font-family:var(--font-display); font-size:18px; color:var(--ink);
    background:rgba(18,20,20,0.6); border:1px solid var(--line); border-radius:2px;
    cursor:grab; touch-action:none; white-space:nowrap;
    text-shadow:0 1px 0 rgba(0,0,0,0.5);
  }
  .map-label:active{cursor:grabbing;}
  .map-label:focus{cursor:text; background:rgba(18,20,20,0.85); outline:1px solid var(--accent);}
  .map-label .row-remove{opacity:0.9; top:-9px; right:-9px; width:20px; height:20px; background:rgba(10,14,18,0.95); border-radius:50%; z-index:5;}
  .map-label:hover .row-remove{opacity:1;}
  .map-label .layer-badge{
    position:absolute; top:-16px; left:50%; transform:translateX(-50%);
    font-size:9px; font-family:var(--font-body); letter-spacing:0.5px;
    background:rgba(35,28,18,0.85); color:#c9bda1; padding:1px 6px; border-radius:2px;
    white-space:nowrap; pointer-events:none; opacity:0; transition:opacity 0.15s;
  }
  .map-label:hover .layer-badge{opacity:0.9;}

  header{
    position:absolute; top:26px; right:36px; z-index:6; text-align:right; max-width:520px;
    background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(2px);
    padding:14px 20px;
  }
  header .brand{
    font-family:var(--font-body); font-size:11px; color:var(--dim);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:10px;
  }
  h1{
    margin:0; font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
    color:var(--ink); text-shadow:0 0 18px rgba(111,216,201,0.25);
  }
  .meta{
    font-family:var(--font-body); font-size:11px; color:var(--accent);
    letter-spacing:1px; margin-top:10px; line-height:1.9; opacity:0.85;
  }

  .panel{
    position:absolute; z-index:6; background:var(--panel);
    border:1px solid var(--line); backdrop-filter: blur(2px);
    padding:16px 18px; max-height:calc(100% - 52px); overflow:auto;
  }
  .panel-title{
    font-family:var(--font-body); font-size:12px; color:var(--accent);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:12px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .legend{ top:26px; left:26px; width:300px; }
  .legend-row{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; position:relative; padding-right:18px;}
  .legend-row:last-child{margin-bottom:0;}
  .swatch{ width:22px; height:22px; flex:0 0 auto; margin-top:2px; border:1px solid var(--line); border-radius:50%; }
  .swatch.has-icon{ border-color:transparent; background-color:transparent; }
  .legend-text{flex:1; min-width:0;}
  .legend-text .t{font-size:15px; font-weight:600; letter-spacing:0.5px; font-family:var(--font-display);}
  .legend-text .d{font-size:12.5px; color:var(--dim); line-height:1.35; font-family:var(--font-body);}

  .factions{ left:26px; bottom:26px; width:520px; }
  .faction-grid{ display:flex; flex-wrap:wrap; gap:10px 26px; }
  .fac-row{ display:flex; gap:10px; margin-bottom:6px; align-items:flex-start; position:relative; padding-right:16px; width:calc(50% - 13px);}
  .fac-icon{width:20px; height:20px; flex:0 0 auto; border:1px solid var(--line); margin-top:2px;}
  .fac-icon.has-icon{ border-color:transparent; background-color:transparent; }
  .fac-text{flex:1; min-width:0;}
  .fac-text .t{font-size:14px; font-weight:600; font-family:var(--font-display);}
  .fac-text .d{font-size:11.5px; color:var(--dim); line-height:1.3; font-family:var(--font-body);}

  .support{ right:26px; bottom:26px; width:420px; }
  .sup-grid{ display:flex; flex-wrap:wrap; gap:10px 24px; }
  .support .fac-row{ width:calc(50% - 12px); }

  .icon-slot{
    cursor:pointer; position:relative; overflow:hidden;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    transition:border-color 0.15s;
  }
  .icon-slot:hover{border-color:var(--accent);}
  .icon-slot input{display:none;}
  .icon-slot::after{
    content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--dim); font-family:var(--font-body); pointer-events:none;
  }
  .icon-slot.has-icon::after{content:'';}

  .row-remove{
    position:absolute; top:0; right:0; width:16px; height:16px; z-index:2;
    background:transparent; border:none; color:var(--danger); font-size:15px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s; font-family:var(--font-body);
  }
  .legend-row:hover .row-remove, .fac-row:hover .row-remove{opacity:0.85;}
  .row-remove:hover{opacity:1 !important;}

  .add-row{
    margin-top:12px; width:100%; background:transparent; border:1px dashed var(--accent-dim);
    color:var(--accent); font-family:var(--font-body); font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; padding:8px; cursor:pointer;
  }
  .add-row:hover{background:rgba(111,216,201,0.08); border-color:var(--accent);}

  .panel-close{
    position:absolute; top:8px; right:8px; width:18px; height:18px; z-index:3;
    background:transparent; border:none; color:var(--danger); font-size:16px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s;
  }
  .panel:hover .panel-close{opacity:0.75;}
  .panel-close:hover{opacity:1 !important;}
  .panel.panel-hidden{display:none;}
  .layers-panel{ top:24px; left:340px; width:220px; }
  .layers-panel .layer-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; padding-right:16px; position:relative; }
  .layers-panel .layer-row .lname{ flex:1; font-size:13px; font-family:var(--font-display); }
  .layers-panel .layer-row input[type=checkbox]{ margin:0; }
  .layers-panel .layer-row.active{ background:var(--accent-dim); border-radius:3px; }
  .layers-panel .layer-row .row-remove{
    opacity:1 !important; position:absolute; top:50%; right:4px; transform:translateY(-50%);
    width:22px; height:22px; font-size:16px; line-height:20px; text-align:center;
    background:var(--danger); color:#f0d9b0; border:1px solid rgba(0,0,0,0.4); border-radius:50%;
  }
  .layers-panel .layer-row:hover .row-remove{ opacity:1; }
  .layer-hidden{ display:none !important; }
  .toolbar button.panel-toggle.off{opacity:0.4;}

  .toast{
    position:fixed; bottom:66px; left:50%; transform:translateX(-50%);
    max-width:520px; background:#1a0d0d; color:#ffc2bc; border:1px solid var(--danger);
    padding:10px 18px; font-family:var(--font-body); font-size:12px; line-height:1.5;
    letter-spacing:0.3px; z-index:100; opacity:0; pointer-events:none;
    transition:opacity 0.25s; text-align:center;
  }
  .toast.show{opacity:1;}

  [contenteditable]:empty::before{content:attr(data-ph); color:var(--dim); opacity:0.7;}
  [contenteditable]{outline:none;}
  [contenteditable]:focus{background:rgba(111,216,201,0.06);}

  .toolbar{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:50; font-family:'Share Tech Mono',monospace; align-items:center;
    flex-wrap:wrap; justify-content:center; max-width:96vw;
  }
  .toolbar button, .toolbar select{
    background:#111; color:var(--accent); border:1px solid var(--accent-dim);
    padding:9px 16px; font-family:inherit; font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase; cursor:pointer;
  }
  .toolbar button:hover{background:rgba(111,216,201,0.12);}
  @media print{ .toolbar{display:none;} body{padding:0;} .row-remove, .add-row, .resize-handle, .rotate-handle, .skew-handle, .arrow-handle, .arrow-rotate-handle, .arrow-skew-handle, .arrow-curve-handle, .grid-overlay{display:none;} }
  .sheet.exporting .add-row,
  .sheet.exporting .panel-close,
  .sheet.exporting .row-remove,
  .sheet.exporting .resize-handle,
  .sheet.exporting .rotate-handle,
  .sheet.exporting .skew-handle,
  .sheet.exporting .arrow-handle,
  .sheet.exporting .arrow-rotate-handle,
  .sheet.exporting .arrow-skew-handle,
  .sheet.exporting .arrow-curve-handle,
  .sheet.exporting .map-label .row-remove,
  .sheet.exporting .icon-slot::after{ display:none !important; }
  .sheet.exporting .terrain-slot{ filter:none !important; }
  .sheet.exporting .panel, .sheet.exporting header{ backdrop-filter:none !important; }
  .sheet.exporting::before{ opacity:0.45 !important; }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <div class="terrain-slot" id="terrainSlot">
    <div class="hint" id="terrainHint">+++ CLIQUER POUR CHARGER LE RELIEF DE TERRAIN +++</div>
    <input type="file" id="terrainInput" accept="image/*">
  </div>

  <div class="grid-overlay" id="gridOverlay"></div>

  <div class="map-layer" id="mapLayer">
    <svg id="arrowLayer" class="arrow-layer" viewBox="0 0 1600 920" preserveAspectRatio="none">
      <defs>
        <marker id="arrowHeadStd" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M0,0 L10,5 L0,10 Z" style="fill:var(--accent)"/>
        </marker>
        <marker id="arrowHeadBold" markerWidth="15" markerHeight="15" refX="12" refY="7.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
          <path d="M0,0 L15,7.5 L0,15 Z" style="fill:var(--danger)"/>
        </marker>
      </defs>
    </svg>
  </div>

  <header>
    <div class="brand" contenteditable="true" data-ph="+++ NOM DE CAMPAGNE +++"></div>
    <h1 contenteditable="true" data-ph="SECTEUR ___________"></h1>
    <div class="meta" contenteditable="true" data-ph="+++LOCSCAN: ___+++&#10;+++TOUR / PHASE: ___+++&#10;+++NOTE: ___+++" style="white-space:pre-line;"></div>
  </header>

  <div class="panel legend">
    <button class="panel-close" data-panel="legend" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ LÉGENDE +++"></div>
    <div id="legendRows">
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="legend">+ Ajouter un point remarquable</button>
  </div>

  <div class="panel factions">
    <button class="panel-close" data-panel="factions" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ ALLOCATIONS DES FORCES +++"></div>
    <div class="faction-grid" id="factionRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Faction A"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Faction B"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="faction">+ Ajouter une faction</button>
  </div>

  <div class="panel support">
    <button class="panel-close" data-panel="support" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ SOUTIEN / RÉSERVES +++"></div>
    <div class="sup-grid" id="supportRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Unité de soutien"></div><div class="d" contenteditable="true" data-ph="Détail"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="support">+ Ajouter un soutien</button>
  </div>

  <div class="panel layers-panel" id="layersPanel">
    <button class="panel-close" data-panel="layers" title="Masquer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="Calques">Calques</div>
    <div id="layerRows"></div>
    <button class="add-row" data-add="layer">+ Ajouter un calque</button>
  </div>
</div>

<div class="toolbar">
  <button onclick="window.print()">Imprimer / PDF</button>
  <select id="exportFormatSelect" title="Format d'export">
    <option value="16:9">Format : 16:9 (écran)</option>
    <option value="a4-landscape">Format : A4 Paysage</option>
    <option value="a4-portrait">Format : A4 Portrait</option>
    <option value="a3-landscape">Format : A3 Paysage</option>
    <option value="a3-portrait">Format : A3 Portrait</option>
  </select>
  <button id="exportPngBtn">Exporter en PNG</button>
  <button onclick="document.getElementById('terrainInput').click()">Changer le terrain</button>
  <input type="range" id="terrainZoom" min="20" max="300" value="100" title="Échelle du terrain (glisser l'image pour la repositionner)">
  <button id="resetTerrainBtn" title="Réinitialiser le cadrage du terrain (zoom 100%, recentré)">⟲ Terrain</button>
  <button id="gridToggleBtn" class="panel-toggle" title="Afficher/masquer la grille">Grille</button>
  <button id="addMarkerBtn">+ Marqueur</button>
  <button id="addLabelBtn">+ Étiquette</button>
  <select id="arrowTypeSelect" title="Type de flèche">
    <option value="standard">Flèche : Standard</option>
    <option value="double">Flèche : Double</option>
    <option value="dashed">Flèche : Pointillée</option>
    <option value="bold">Flèche : Renfort (épaisse)</option>
    <option value="curve">Flèche : Flanc (courbe)</option>
  </select>
  <button id="addArrowBtn">+ Flèche</button>
  <button class="panel-toggle" data-panel="legend">Légende</button>
  <button class="panel-toggle" data-panel="layers">Calques</button>
  <select id="activeLayerSelect" title="Calque actif (où placer les nouveaux marqueurs)"></select>
  <button class="panel-toggle" data-panel="factions">Factions</button>
  <button class="panel-toggle" data-panel="support">Soutien</button>
  <select id="fontSelect" title="Police de la carte"></select>
  <select id="paletteSelect" title="Palette de couleurs"></select>
  <button id="saveProjectBtn">Sauvegarder</button>
  <button onclick="document.getElementById('loadProjectInput').click()">Charger</button>
  <button id="newMapBtn" title="Remettre la carte à vide">Nouvelle carte</button>
  <button id="undoBtn" title="Annuler (Ctrl+Z)">↶ Annuler</button>
  <button id="redoBtn" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
  <span style="color:#6b5228; font-size:10px; padding:0 6px;">v2.8</span>
  <input type="file" id="loadProjectInput" accept="application/json,.json" style="display:none">
</div>

<script>
  // ---------- Image loading helper (with format validation) ----------
  function showToast(msg){
    let toast = document.getElementById('toast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(()=> toast.classList.remove('show'), 4500);
  }
  function readImageFile(file, onSuccess){
    const reader = new FileReader();
    reader.onload = ()=>{
      const test = new Image();
      test.onload = ()=> onSuccess(reader.result);
      test.onerror = ()=> showToast(`Format non pris en charge par le navigateur : "${file.name}". Exporte plutôt en PNG ou JPG (les formats TIFF/EXR ne s'affichent pas dans un navigateur).`);
      test.src = reader.result;
    };
    reader.onerror = ()=> showToast(`Impossible de lire le fichier "${file.name}".`);
    reader.readAsDataURL(file);
  }

  // ---------- Terrain background ----------
  const slot = document.getElementById('terrainSlot');
  const input = document.getElementById('terrainInput');
  const hint = document.getElementById('terrainHint');
  const terrainZoom = document.getElementById('terrainZoom');
  let terrainScale = 1, terrainOffsetX = 0, terrainOffsetY = 0, terrainPan = null;

  function updateTerrainTransform(){
    const img = slot.querySelector('img');
    if(img) img.style.transform = `translate(${terrainOffsetX}%, ${terrainOffsetY}%) scale(${terrainScale})`;
  }
  terrainZoom.addEventListener('input', ()=>{
    terrainScale = terrainZoom.value / 100;
    updateTerrainTransform();
  });
  document.addEventListener('pointerdown', e=>{
    const img = e.target.closest('#terrainSlot img');
    if(!img) return;
    terrainPan = { startX:e.clientX, startY:e.clientY, baseX:terrainOffsetX, baseY:terrainOffsetY, rect: slot.getBoundingClientRect() };
  });
  document.addEventListener('pointermove', e=>{
    if(!terrainPan) return;
    const r = terrainPan.rect;
    terrainOffsetX = terrainPan.baseX + ((e.clientX - terrainPan.startX) / r.width) * 100;
    terrainOffsetY = terrainPan.baseY + ((e.clientY - terrainPan.startY) / r.height) * 100;
    updateTerrainTransform();
  });
  document.addEventListener('pointerup', ()=>{ terrainPan = null; });
  document.getElementById('resetTerrainBtn').addEventListener('click', ()=>{
    pushHistory();
    terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
    terrainZoom.value = 100;
    updateTerrainTransform();
  });

  slot.addEventListener('click', ()=>{ if(!slot.querySelector('img')) input.click(); });
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    readImageFile(file, dataURL=>{
      pushHistory();
      let img = slot.querySelector('img');
      if(!img){ img = document.createElement('img'); slot.appendChild(img); hint.style.display='none'; }
      img.src = dataURL;
      terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
      terrainZoom.value = 100;
      updateTerrainTransform();
    });
  });
  slot.addEventListener('dragover', e=>{e.preventDefault();});
  slot.addEventListener('drop', e=>{
    e.preventDefault();
    const bg = e.dataTransfer.getData('text/plain');
    if(bg && bg.startsWith('url(')){
      const rect = slot.getBoundingClientRect();
      const leftPct = ((e.clientX - rect.left) / rect.width) * 100;
      const topPct = ((e.clientY - rect.top) / rect.height) * 100;
      pushHistory();
      makeMarker(leftPct, topPct, bg);
      return;
    }
    const file = e.dataTransfer.files[0];
    if(file){ input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
  });

  // ---------- Row builders ----------
  function applyRowData(row, data){
    if(!data) return;
    const iconSlot = row.querySelector('.icon-slot');
    if(data.icon){ iconSlot.style.backgroundImage = `url(${data.icon})`; iconSlot.classList.add('has-icon'); iconSlot.draggable = true; }
    if(data.t !== undefined) row.querySelector('.t').innerHTML = data.t;
    if(data.d !== undefined) row.querySelector('.d').innerHTML = data.d;
  }
  function addLegendRow(data){
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>`;
    document.getElementById('legendRows').appendChild(row);
    applyRowData(row, data);
    return row;
  }
  function addFacRow(containerId, nameHint, detailHint, data){
    const row = document.createElement('div');
    row.className = 'fac-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="fac-text"><div class="t" contenteditable="true" data-ph="${nameHint}"></div><div class="d" contenteditable="true" data-ph="${detailHint}"></div></div>`;
    document.getElementById(containerId).appendChild(row);
    applyRowData(row, data);
    return row;
  }

  // ---------- Markers on the map ----------
  const mapLayer = document.getElementById('mapLayer');
  // ---------- Layers (marker groups) ----------
  let layers = [ { name:'Par défaut', visible:true } ];
  let activeLayerName = 'Par défaut';
  const layerRowsEl = document.getElementById('layerRows');
  const activeLayerSelect = document.getElementById('activeLayerSelect');

  function renderLayersUI(){
    activeLayerSelect.innerHTML = '';
    layers.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = l.name; opt.textContent = l.name;
      if(l.name === activeLayerName) opt.selected = true;
      activeLayerSelect.appendChild(opt);
    });
    layerRowsEl.innerHTML = '';
    layers.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'layer-row' + (l.name === activeLayerName ? ' active' : '');
      row.innerHTML = `<input type="checkbox" ${l.visible ? 'checked' : ''} title="Afficher/Masquer">
        <span class="lname" contenteditable="true" data-ph="Nom du calque">${l.name}</span>
        <button class="row-remove" title="Supprimer le calque">×</button>`;
      const cb = row.querySelector('input[type=checkbox]');
      const nameEl = row.querySelector('.lname');
      row.addEventListener('click', e=>{
        if(e.target === cb || e.target.closest('.row-remove') || e.target === nameEl) return;
        setActiveLayer(l.name);
      });
      cb.addEventListener('change', ()=>{
        l.visible = cb.checked;
        applyLayerVisibility();
        scheduleAutosave();
      });
      nameEl.addEventListener('blur', ()=>{
        const newName = nameEl.textContent.trim() || l.name;
        if(newName !== l.name){
          const oldName = l.name;
          l.name = newName;
          document.querySelectorAll(`#mapLayer .map-marker[data-layer="${cssEscape(oldName)}"]`).forEach(m=>{ m.dataset.layer = newName; });
          document.querySelectorAll(`#mapLayer .map-label[data-layer="${cssEscape(oldName)}"]`).forEach(m=>{ m.dataset.layer = newName; });
          document.querySelectorAll(`#arrowLayer .arrow-path[data-layer="${cssEscape(oldName)}"]`).forEach(p=>{ p.dataset.layer = newName; });
          if(activeLayerName === oldName) activeLayerName = newName;
          renderLayersUI();
          scheduleAutosave();
        }
      });
      layerRowsEl.appendChild(row);
    });
  }
  function cssEscape(str){ return String(str).replace(/["\\]/g, '\\$&'); }
  function setActiveLayer(name){ activeLayerName = name; renderLayersUI(); }
  function updateLayerBadge(el){
    const badge = el.querySelector('.layer-badge');
    if(badge){ badge.textContent = '▸ ' + (el.dataset.layer || 'Par défaut'); }
  }
  function applyLayerVisibility(){
    document.querySelectorAll('#mapLayer .map-marker, #mapLayer .map-label, #mapLayer .arrow-handle').forEach(m=>{
      updateLayerBadge(m);
      const ln = m.dataset.layer || 'Par défaut';
      const layer = layers.find(l=>l.name === ln) || { visible:true };
      m.classList.toggle('layer-hidden', !layer.visible);
    });
    document.querySelectorAll('#arrowLayer .arrow-path').forEach(p=>{
      const ln = p.dataset.layer || 'Par défaut';
      const layer = layers.find(l=>l.name === ln) || { visible:true };
      const hidden = !layer.visible;
      p.classList.toggle('layer-hidden', hidden);
      const id = p.dataset.id;
      document.querySelectorAll(`.arrow-handle[data-id="${id}"], .arrow-rotate-handle[data-id="${id}"], .arrow-skew-handle[data-id="${id}"]`).forEach(h=> h.classList.toggle('layer-hidden', hidden));
    });
  }
  activeLayerSelect.addEventListener('change', ()=>{ activeLayerName = activeLayerSelect.value; renderLayersUI(); });
  renderLayersUI();

  // Marker that was just dragged; its following click (the browser synthesizes
  // one after pointerup) must be swallowed so it doesn't open the file picker.
  let justDraggedMarker = null;
  let dragState = null;

  function updateMarkerTransform(marker){
    const rot = parseFloat(marker.dataset.rotation) || 0;
    const skew = parseFloat(marker.dataset.skew) || 0;
    marker.style.transform = `translate(-50%,-50%) rotate(${rot}deg) skew(${skew}deg)`;
  }
  function makeMarker(leftPct, topPct, bgImage, size, layer, rotation, skew){
    const marker = document.createElement('div');
    marker.className = 'map-marker icon-slot' + (bgImage ? ' has-icon' : '');
    marker.style.left = leftPct + '%';
    marker.style.top = topPct + '%';
    marker.dataset.layer = layer || activeLayerName;
    marker.dataset.rotation = rotation || 0;
    marker.dataset.skew = skew || 0;
    if(size){ marker.style.width = size + 'px'; marker.style.height = size + 'px'; }
    if(bgImage){ marker.style.backgroundImage = bgImage; }
    marker.innerHTML = '<input type="file" class="icon-input" accept="image/*"><button class="row-remove" title="Supprimer">×</button><div class="resize-handle" title="Redimensionner"></div><div class="rotate-handle" title="Faire pivoter"></div><div class="skew-handle" title="Incliner (effet 3D)"></div>';
    mapLayer.appendChild(marker);
    updateMarkerTransform(marker);
    applyLayerVisibility();
    return marker;
  }
  document.getElementById('addMarkerBtn').addEventListener('click', ()=>{ pushHistory(); makeMarker(50, 50, null); });
  // ---------- Free-text labels on the map ----------
  function makeLabel(leftPct, topPct, text, layer){
    const label = document.createElement('div');
    label.className = 'map-label';
    label.setAttribute('contenteditable', 'true');
    label.style.left = leftPct + '%';
    label.style.top = topPct + '%';
    label.dataset.layer = layer || activeLayerName;
    label.innerHTML = '<button class="row-remove" title="Supprimer">×</button><div class="layer-badge"></div>';
    const span = document.createElement('span');
    span.textContent = text || '';
    label.appendChild(span);
    updateLayerBadge(label);
    mapLayer.appendChild(label);
    applyLayerVisibility();
    return label;
  }
  document.getElementById('addLabelBtn').addEventListener('click', ()=>{
    pushHistory();
    const lbl = makeLabel(50, 50, 'Nouveau texte');
    lbl.focus();
    const range = document.createRange();
    range.selectNodeContents(lbl.querySelector('span'));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
  });
  function serializeLabel(label){
    const span = label.querySelector('span');
    return {
      left: parseFloat(label.style.left),
      top: parseFloat(label.style.top),
      text: span ? span.innerHTML : '',
      layer: label.dataset.layer || activeLayerName
    };
  }

  // ---------- Arrows ----------
  const arrowLayer = document.getElementById('arrowLayer');
  let VB_W = 1600, VB_H = 920; // must match the arrowLayer viewBox; updated during export
  let arrowCounter = 0;
  const ARROW_TYPES = ['standard','double','dashed','bold','curve'];
  function updateArrowPath(id){
    const pathEl = arrowLayer.querySelector(`path[data-id="${id}"]`);
    const startEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="start"]`);
    const endEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="end"]`);
    if(!pathEl || !startEl || !endEl) return;
    const x1pct = parseFloat(startEl.style.left), y1pct = parseFloat(startEl.style.top);
    const x2pct = parseFloat(endEl.style.left), y2pct = parseFloat(endEl.style.top);
    const x1 = x1pct/100*VB_W, y1 = y1pct/100*VB_H;
    const x2 = x2pct/100*VB_W, y2 = y2pct/100*VB_H;
    let d;
    const curveH = mapLayer.querySelector(`.arrow-curve-handle[data-id="${id}"]`);
    if(pathEl.dataset.type === 'curve'){
      const mx = (x1+x2)/2, my = (y1+y2)/2;
      const dx = x2-x1, dy = y2-y1;
      const len = Math.hypot(dx,dy) || 1;
      const offsetFrac = parseFloat(pathEl.dataset.curveOffset);
      const offset = len * (isNaN(offsetFrac) ? 0.18 : offsetFrac);
      const nx = -dy/len, ny = dx/len;
      const cx = mx + nx*offset, cy = my + ny*offset;
      d = `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
      if(curveH){ curveH.style.left = (cx/VB_W*100) + '%'; curveH.style.top = (cy/VB_H*100) + '%'; curveH.classList.add('active'); }
    } else {
      d = `M${x1},${y1} L${x2},${y2}`;
      if(curveH) curveH.classList.remove('active');
    }
    pathEl.setAttribute('d', d);
    const midX = (x1pct + x2pct) / 2, midY = (y1pct + y2pct) / 2;
    const rotH = mapLayer.querySelector(`.arrow-rotate-handle[data-id="${id}"]`);
    const skewH = mapLayer.querySelector(`.arrow-skew-handle[data-id="${id}"]`);
    if(rotH){ rotH.style.left = midX + '%'; rotH.style.top = midY + '%'; }
    if(skewH){ skewH.style.left = midX + '%'; skewH.style.top = midY + '%'; }
  }
  function updateArrowTransform(id){
    const pathEl = arrowLayer.querySelector(`path[data-id="${id}"]`);
    if(!pathEl) return;
    const rot = parseFloat(pathEl.dataset.rotation) || 0;
    const skew = parseFloat(pathEl.dataset.skew) || 0;
    pathEl.style.transform = `rotate(${rot}deg) skew(${skew}deg)`;
  }
  function makeArrow(x1, y1, x2, y2, type, layer, rotation, skew, curveOffset){
    type = ARROW_TYPES.includes(type) ? type : 'standard';
    const id = 'arrow' + (arrowCounter++);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.dataset.id = id;
    path.dataset.type = type;
    path.dataset.layer = layer || activeLayerName;
    path.dataset.rotation = rotation || 0;
    path.dataset.skew = skew || 0;
    path.dataset.curveOffset = (typeof curveOffset === 'number' && !isNaN(curveOffset)) ? curveOffset : 0.18;
    path.setAttribute('class', 'arrow-path ' + type);
    if(type === 'double'){ path.setAttribute('marker-start', 'url(#arrowHeadStd)'); path.setAttribute('marker-end', 'url(#arrowHeadStd)'); }
    else if(type === 'bold'){ path.setAttribute('marker-end', 'url(#arrowHeadBold)'); }
    else { path.setAttribute('marker-end', 'url(#arrowHeadStd)'); }
    arrowLayer.appendChild(path);

    const startHandle = document.createElement('div');
    startHandle.className = 'arrow-handle';
    startHandle.dataset.id = id; startHandle.dataset.role = 'start';
    startHandle.style.left = x1 + '%'; startHandle.style.top = y1 + '%';
    startHandle.innerHTML = '<button class="row-remove" title="Supprimer la flèche">×</button>';
    mapLayer.appendChild(startHandle);

    const endHandle = document.createElement('div');
    endHandle.className = 'arrow-handle';
    endHandle.dataset.id = id; endHandle.dataset.role = 'end';
    endHandle.style.left = x2 + '%'; endHandle.style.top = y2 + '%';
    mapLayer.appendChild(endHandle);

    const rotateHandle = document.createElement('div');
    rotateHandle.className = 'arrow-rotate-handle';
    rotateHandle.dataset.id = id;
    rotateHandle.title = 'Faire pivoter la flèche';
    mapLayer.appendChild(rotateHandle);

    const skewHandle = document.createElement('div');
    skewHandle.className = 'arrow-skew-handle';
    skewHandle.dataset.id = id;
    skewHandle.title = 'Incliner la flèche (effet 3D)';
    mapLayer.appendChild(skewHandle);

    const curveHandle = document.createElement('div');
    curveHandle.className = 'arrow-curve-handle';
    curveHandle.dataset.id = id;
    curveHandle.title = 'Ajuster la courbe';
    mapLayer.appendChild(curveHandle);

    updateArrowPath(id);
    updateArrowTransform(id);
    applyLayerVisibility();
    return id;
  }
  function removeArrow(id){
    arrowLayer.querySelectorAll(`path[data-id="${id}"]`).forEach(p=>p.remove());
    mapLayer.querySelectorAll(`.arrow-handle[data-id="${id}"], .arrow-rotate-handle[data-id="${id}"], .arrow-skew-handle[data-id="${id}"], .arrow-curve-handle[data-id="${id}"]`).forEach(h=>h.remove());
  }
  function serializeArrow(id){
    const pathEl = arrowLayer.querySelector(`path[data-id="${id}"]`);
    const startEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="start"]`);
    const endEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="end"]`);
    if(!pathEl || !startEl || !endEl) return null;
    return {
      x1: parseFloat(startEl.style.left), y1: parseFloat(startEl.style.top),
      x2: parseFloat(endEl.style.left), y2: parseFloat(endEl.style.top),
      type: pathEl.dataset.type,
      rotation: parseFloat(pathEl.dataset.rotation) || 0,
      skew: parseFloat(pathEl.dataset.skew) || 0,
      curveOffset: parseFloat(pathEl.dataset.curveOffset),
      layer: pathEl.dataset.layer || activeLayerName
    };
  }
  function allArrowIds(){
    const ids = new Set();
    mapLayer.querySelectorAll('.arrow-handle').forEach(h=> ids.add(h.dataset.id));
    return Array.from(ids);
  }
  document.getElementById('addArrowBtn').addEventListener('click', ()=>{
    pushHistory();
    const type = document.getElementById('arrowTypeSelect').value;
    makeArrow(35, 50, 65, 50, type);
  });

  // ---------- Grid overlay ----------
  const gridOverlay = document.getElementById('gridOverlay');
  let gridVisible = false;
  function setGridVisible(v){
    gridVisible = v;
    gridOverlay.classList.toggle('visible', v);
    const btn = document.getElementById('gridToggleBtn');
    if(btn) btn.classList.toggle('off', !v);
  }
  document.getElementById('gridToggleBtn').addEventListener('click', ()=> setGridVisible(!gridVisible));

  let resizeState = null;
  let rotateState = null;
  let skewState = null;
  let arrowRotateState = null;
  let arrowSkewState = null;
  let arrowMoveState = null;
  let curveDragState = null;
  document.addEventListener('pointerdown', e=>{
    if(e.target.closest('.arrow-curve-handle')){
      const handle = e.target.closest('.arrow-curve-handle');
      const id = handle.dataset.id;
      const startEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="start"]`);
      const endEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="end"]`);
      if(!startEl || !endEl) return;
      e.preventDefault();
      const rect = handle.closest('.sheet').getBoundingClientRect();
      const x1 = parseFloat(startEl.style.left)/100*rect.width, y1 = parseFloat(startEl.style.top)/100*rect.height;
      const x2 = parseFloat(endEl.style.left)/100*rect.width, y2 = parseFloat(endEl.style.top)/100*rect.height;
      const dx = x2-x1, dy = y2-y1;
      const len = Math.hypot(dx,dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const pathEl = arrowLayer.querySelector(`path[data-id="${id}"]`);
      const startOffset = parseFloat(pathEl.dataset.curveOffset);
      curveDragState = { id, startX:e.clientX, startY:e.clientY, nx, ny, len, startOffset: isNaN(startOffset) ? 0.18 : startOffset, moved:false };
      return;
    }
    if(e.target.closest('.arrow-rotate-handle')){
      const handle = e.target.closest('.arrow-rotate-handle');
      e.preventDefault();
      const rect = handle.getBoundingClientRect();
      arrowRotateState = { id: handle.dataset.id, cx: rect.left + rect.width/2, cy: rect.top + rect.height/2, moved:false };
      return;
    }
    if(e.target.closest('.arrow-skew-handle')){
      const handle = e.target.closest('.arrow-skew-handle');
      e.preventDefault();
      const pathEl = arrowLayer.querySelector(`path[data-id="${handle.dataset.id}"]`);
      const startSkew = pathEl ? (parseFloat(pathEl.dataset.skew) || 0) : 0;
      arrowSkewState = { id: handle.dataset.id, startX:e.clientX, startSkew, moved:false };
      return;
    }
    if(e.target.closest('.resize-handle')){
      const marker = e.target.closest('.map-marker');
      if(!marker) return;
      e.preventDefault();
      const startW = parseFloat(getComputedStyle(marker).width) || 32;
      resizeState = { marker, startX:e.clientX, startW, moved:false };
      return;
    }
    if(e.target.closest('.rotate-handle')){
      const marker = e.target.closest('.map-marker');
      if(!marker) return;
      e.preventDefault();
      const rect = marker.getBoundingClientRect();
      rotateState = { marker, cx: rect.left + rect.width/2, cy: rect.top + rect.height/2, moved:false };
      return;
    }
    if(e.target.closest('.skew-handle')){
      const marker = e.target.closest('.map-marker');
      if(!marker) return;
      e.preventDefault();
      const startSkew = parseFloat(marker.dataset.skew) || 0;
      skewState = { marker, startX:e.clientX, startSkew, moved:false };
      return;
    }
    const arrowPath = e.target.closest('.arrow-path');
    if(arrowPath && !arrowPath.classList.contains('layer-hidden')){
      const id = arrowPath.dataset.id;
      const startEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="start"]`);
      const endEl = mapLayer.querySelector(`.arrow-handle[data-id="${id}"][data-role="end"]`);
      if(!startEl || !endEl) return;
      e.preventDefault();
      arrowMoveState = {
        id, startX:e.clientX, startY:e.clientY,
        baseStartX: parseFloat(startEl.style.left), baseStartY: parseFloat(startEl.style.top),
        baseEndX: parseFloat(endEl.style.left), baseEndY: parseFloat(endEl.style.top),
        rect: arrowPath.closest('.sheet').getBoundingClientRect(),
        moved:false
      };
      return;
    }
    const marker = e.target.closest('.map-marker, .map-label, .arrow-handle');
    if(!marker || e.target.closest('.row-remove')) return;
    // A contenteditable label is dragged only while Shift is held; otherwise the
    // click places the caret for text editing.
    if(marker.classList.contains('map-label') && !e.shiftKey) return;
    if(marker.isContentEditable){ marker.blur(); }
    dragState = { marker, startX:e.clientX, startY:e.clientY, moved:false, rect: marker.closest('.sheet').getBoundingClientRect() };
  });
  document.addEventListener('pointermove', e=>{
    if(arrowRotateState){
      const dx = e.clientX - arrowRotateState.cx, dy = e.clientY - arrowRotateState.cy;
      const angle = Math.atan2(dy, dx) * 180/Math.PI + 90;
      const pathEl = arrowLayer.querySelector(`path[data-id="${arrowRotateState.id}"]`);
      if(pathEl){ pathEl.dataset.rotation = angle.toFixed(1); updateArrowTransform(arrowRotateState.id); }
      if(!arrowRotateState.moved){ arrowRotateState.moved = true; pushHistory(); }
      return;
    }
    if(arrowSkewState){
      const dx = e.clientX - arrowSkewState.startX;
      const newSkew = Math.max(-60, Math.min(60, arrowSkewState.startSkew + dx/2));
      const pathEl = arrowLayer.querySelector(`path[data-id="${arrowSkewState.id}"]`);
      if(pathEl){ pathEl.dataset.skew = newSkew.toFixed(1); updateArrowTransform(arrowSkewState.id); }
      if(!arrowSkewState.moved){ arrowSkewState.moved = true; pushHistory(); }
      return;
    }
    if(curveDragState){
      const dx = e.clientX - curveDragState.startX, dy = e.clientY - curveDragState.startY;
      const proj = dx*curveDragState.nx + dy*curveDragState.ny;
      const fracDelta = proj / curveDragState.len;
      const pathEl = arrowLayer.querySelector(`path[data-id="${curveDragState.id}"]`);
      if(pathEl){ pathEl.dataset.curveOffset = (curveDragState.startOffset + fracDelta).toFixed(3); updateArrowPath(curveDragState.id); }
      if(!curveDragState.moved){ curveDragState.moved = true; pushHistory(); }
      return;
    }
    if(arrowMoveState){
      const r = arrowMoveState.rect;
      const dxPct = ((e.clientX - arrowMoveState.startX)/r.width)*100;
      const dyPct = ((e.clientY - arrowMoveState.startY)/r.height)*100;
      const startEl = mapLayer.querySelector(`.arrow-handle[data-id="${arrowMoveState.id}"][data-role="start"]`);
      const endEl = mapLayer.querySelector(`.arrow-handle[data-id="${arrowMoveState.id}"][data-role="end"]`);
      if(startEl && endEl){
        startEl.style.left = Math.min(100, Math.max(0, arrowMoveState.baseStartX + dxPct)) + '%';
        startEl.style.top = Math.min(100, Math.max(0, arrowMoveState.baseStartY + dyPct)) + '%';
        endEl.style.left = Math.min(100, Math.max(0, arrowMoveState.baseEndX + dxPct)) + '%';
        endEl.style.top = Math.min(100, Math.max(0, arrowMoveState.baseEndY + dyPct)) + '%';
        updateArrowPath(arrowMoveState.id);
      }
      if(!arrowMoveState.moved){ arrowMoveState.moved = true; pushHistory(); }
      return;
    }
    if(resizeState){
      const dx = e.clientX - resizeState.startX;
      const newW = Math.max(16, Math.min(200, resizeState.startW + dx));
      resizeState.marker.style.width = newW + 'px';
      resizeState.marker.style.height = newW + 'px';
      if(Math.abs(dx) > 2 && !resizeState.moved){ resizeState.moved = true; pushHistory(); }
      return;
    }
    if(rotateState){
      const dx = e.clientX - rotateState.cx, dy = e.clientY - rotateState.cy;
      const angle = Math.atan2(dy, dx) * 180/Math.PI + 90;
      rotateState.marker.dataset.rotation = angle.toFixed(1);
      updateMarkerTransform(rotateState.marker);
      if(!rotateState.moved){ rotateState.moved = true; pushHistory(); }
      return;
    }
    if(skewState){
      const dx = e.clientX - skewState.startX;
      const newSkew = Math.max(-60, Math.min(60, skewState.startSkew + dx/2));
      skewState.marker.dataset.skew = newSkew.toFixed(1);
      updateMarkerTransform(skewState.marker);
      if(!skewState.moved){ skewState.moved = true; pushHistory(); }
      return;
    }
    if(!dragState) return;
    const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
      if(!dragState.moved){ dragState.moved = true; pushHistory(); }
    }
    if(dragState.moved){
      const r = dragState.rect;
      let leftPct = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100));
      let topPct = Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100));
      dragState.marker.style.left = leftPct + '%';
      dragState.marker.style.top = topPct + '%';
      if(dragState.marker.classList.contains('arrow-handle')) updateArrowPath(dragState.marker.dataset.id);
    }
  });
  document.addEventListener('pointerup', ()=>{
    arrowRotateState = null;
    arrowSkewState = null;

  function pushHistory(){

  function updateUndoBtn(){
    const u = document.getElementById('undoBtn');
    if(u) u.disabled = undoStack.length === 0;

    if(r) r.disabled = redoStack.length === 0;
  }
  function undo(){
    if(undoStack.length === 0) return;
    const entry = undoStack[undoStack.length-1];
    if(entry && entry.__textRestore){
      redoStack.push(captureState());
      const e = undoStack.pop();
      const cur = e.el.innerHTML;
      e.el.innerHTML = e.prev;
      e.prev = cur;
      updateUndoBtn();
      scheduleAutosave();
      return;
    }
    redoStack.push(captureState());
    const prev = undoStack.pop();
    loadProject(prev);
    updateUndoBtn();
  }
  function redo(){
    if(redoStack.length === 0) return;
    const entry = redoStack[redoStack.length-1];

      undoStack.push(captureState());
      const e = redoStack.pop();
      const cur = e.el.innerHTML;
      e.el.innerHTML = e.prev;
      e.prev = cur;
      updateUndoBtn();
      scheduleAutosave();
      return;

    undoStack.push(captureState());
    const next = redoStack.pop();
    loadProject(next);
    updateUndoBtn();

  // ---------- Export to PNG ----------
  function pinCssVarsForExport(){
    const root = document.documentElement;
    const computed = getComputedStyle(root);
    const varNames = ['--bg','--panel','--line','--ink','--dim','--accent','--accent-dim','--danger','--font-display','--font-body'];
    let css = '#sheet, #sheet *{';
    varNames.forEach(v=>{ css += `${v}: ${computed.getPropertyValue(v).trim()} !important;`; });
    css += '}';
    const styleEl = document.createElement('style');
    styleEl.id = 'exportVarOverride';
    styleEl.textContent = css;
    document.head.appendChild(styleEl);
  }
  function unpinCssVarsForExport(){
    const el = document.getElementById('exportVarOverride');
    if(el) el.remove();
  }
  const EXPORT_FORMATS = {
    '16:9':          { w:1600, h:920,  scale:2 },
    'a4-landscape':  { w:1754, h:1240, scale:1 },
    'a4-portrait':   { w:1240, h:1754, scale:1 },
    'a3-landscape':  { w:2480, h:1754, scale:1 },
    'a3-portrait':   { w:1754, h:2480, scale:1 },
  };
  function setArrowViewBox(w, h){
    VB_W = w; VB_H = h;
    arrowLayer.setAttribute('viewBox', `0 0 ${w} ${h}`);
    allArrowIds().forEach(updateArrowPath);
  }
  async function exportPng(){
    if(typeof html2canvas === 'undefined'){
      showToast("La bibliothèque d'export image n'a pas pu se charger (connexion internet ?). Réessaie, ou utilise \"Imprimer / PDF\".");
      return;
    }
    const sheetEl = document.getElementById('sheet');
    sheetEl.classList.add('exporting');
    pinCssVarsForExport();

    const fmtKey = document.getElementById('exportFormatSelect').value;
    const fmt = EXPORT_FORMATS[fmtKey] || EXPORT_FORMATS['16:9'];

    // Pin the sheet to its native pixel size OFF-SCREEN (rather than resizing
    // it in place) so the capture is pixel-accurate without ever flashing the
    // resized card in the viewport. html2canvas mis-handles `aspect-ratio` +
    // `max-width:100%`, which is why a fixed pixel size is needed at all.
    const prevStyle = sheetEl.getAttribute('style') || '';
    sheetEl.style.position = 'fixed';
    sheetEl.style.left = '-99999px';
    sheetEl.style.top = '0';
    sheetEl.style.width = fmt.w + 'px';
    sheetEl.style.height = fmt.h + 'px';
    sheetEl.style.maxWidth = 'none';
    sheetEl.style.aspectRatio = 'auto';
    sheetEl.style.transform = 'none';
    // Arrows are drawn on a fixed-unit SVG viewBox; retarget it to the export
    // format so percentage-based endpoints land in the right place without
    // stretching stroke widths or arrowheads.
    setArrowViewBox(fmt.w, fmt.h);

    try{
      const canvas = await html2canvas(sheetEl, { backgroundColor: null, scale: fmt.scale, width: fmt.w, height: fmt.h, windowWidth: fmt.w, windowHeight: fmt.h });
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const rawTitle = (document.querySelector('header h1').innerText || 'carte-gf').trim();
        a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-gf') + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    } catch(err){
      showToast("Erreur lors de l'export en image. Réessaie, ou utilise \"Imprimer / PDF\".");
    } finally {
      sheetEl.classList.remove('exporting');
      sheetEl.setAttribute('style', prevStyle);
      setArrowViewBox(1600, 920);
      unpinCssVarsForExport();
    }
  }
  document.getElementById('exportPngBtn').addEventListener('click', exportPng);

  // ---------- Keep the toolbar from covering the bottom panels ----------
  // The toolbar wraps to a variable number of rows depending on window width
  // and font loading; measure its real height instead of guessing a fixed value.
  function adjustBodyPadding(){
    const toolbar = document.querySelector('.toolbar');
    if(!toolbar) return;
    document.body.style.paddingBottom = (toolbar.getBoundingClientRect().height + 40) + 'px';
  }
  window.addEventListener('resize', adjustBodyPadding);
  window.addEventListener('load', adjustBodyPadding);
  adjustBodyPadding();
  setTimeout(adjustBodyPadding, 400); // re-measure once webfonts have settled

  // ---------- Save / Load project ----------
  function urlFromBg(bg){
    if(!bg) return null;
    const m = bg.match(/^url\((['"]?)(.*)\1\)$/);
    return m ? m[2] : null;
  }
  function serializeRow(row){
    const iconSlot = row.querySelector('.icon-slot');
    return {
      icon: urlFromBg(iconSlot.style.backgroundImage),
      t: row.querySelector('.t').innerHTML,
      d: row.querySelector('.d').innerHTML
    };
  }
  function serializeMarker(marker){
    const w = parseFloat(marker.style.width);
    return {
      left: parseFloat(marker.style.left),
      top: parseFloat(marker.style.top),
      size: isNaN(w) ? null : w,
      rotation: parseFloat(marker.dataset.rotation) || 0,
      skew: parseFloat(marker.dataset.skew) || 0,
      layer: marker.dataset.layer || activeLayerName,
      icon: urlFromBg(marker.style.backgroundImage)
    };
  }
  function saveProject(){
    const terrainImg = document.querySelector('.terrain-slot img');
    const state = {
      version: 1,
      template: 'gf',
      brand: document.querySelector('header .brand').innerHTML,
      title: document.querySelector('header h1').innerHTML,
      meta: document.querySelector('header .meta').innerHTML,
      terrain: terrainImg ? terrainImg.src : null,
      terrainScale: terrainScale,
      terrainOffsetX: terrainOffsetX,
      terrainOffsetY: terrainOffsetY,
      legendTitle: document.querySelector('.legend .panel-title').innerHTML,
      legend: Array.from(document.querySelectorAll('#legendRows .legend-row')).map(serializeRow),
      factionTitle: document.querySelector('.factions .panel-title').innerHTML,
      factions: Array.from(document.querySelectorAll('#factionRows .fac-row')).map(serializeRow),
      supportTitle: document.querySelector('.support .panel-title').innerHTML,
      support: Array.from(document.querySelectorAll('#supportRows .fac-row')).map(serializeRow),
      layers: layers.map(l=>({name:l.name, visible:l.visible})),
      activeLayer: activeLayerName,
      layersVisible: !document.querySelector('.layers-panel').classList.contains('panel-hidden'),
      labels: Array.from(document.querySelectorAll('#mapLayer .map-label')).map(serializeLabel),
      markers: Array.from(document.querySelectorAll('#mapLayer .map-marker')).map(serializeMarker),
      arrows: allArrowIds().map(serializeArrow).filter(Boolean),
      gridVisible: gridVisible,
      legendVisible: !document.querySelector('.legend').classList.contains('panel-hidden'),
      factionsVisible: !document.querySelector('.factions').classList.contains('panel-hidden'),
      supportVisible: !document.querySelector('.support').classList.contains('panel-hidden'),
      font: parseInt(fontSelect.value || 0),
      palette: parseInt(paletteSelect.value || 0)
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const rawTitle = (document.querySelector('header h1').innerText || 'carte-projet-gf').trim();
    a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-projet-gf') + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function loadProject(state){
    document.querySelector('header .brand').innerHTML = state.brand || '';
    document.querySelector('header h1').innerHTML = state.title || '';
    document.querySelector('header .meta').innerHTML = state.meta || '';
    if(state.terrain){
      let img = document.querySelector('.terrain-slot img');
      if(!img){ img = document.createElement('img'); document.getElementById('terrainSlot').appendChild(img); }
      img.src = state.terrain;
      hint.style.display = 'none';
      terrainScale = typeof state.terrainScale === 'number' ? state.terrainScale : 1;
      terrainOffsetX = typeof state.terrainOffsetX === 'number' ? state.terrainOffsetX : 0;
      terrainOffsetY = typeof state.terrainOffsetY === 'number' ? state.terrainOffsetY : 0;
      terrainZoom.value = Math.round(terrainScale * 100);
      updateTerrainTransform();
    } else {
      const img = document.querySelector('.terrain-slot img');
      if(img){ img.remove(); }
      hint.style.display = '';
      terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
      terrainZoom.value = 100;
      updateTerrainTransform();
    }
    if(state.legendTitle !== undefined) document.querySelector('.legend .panel-title').innerHTML = state.legendTitle;
    if(state.factionTitle !== undefined) document.querySelector('.factions .panel-title').innerHTML = state.factionTitle;
    if(state.supportTitle !== undefined) document.querySelector('.support .panel-title').innerHTML = state.supportTitle;

    document.getElementById('legendRows').innerHTML = '';
    (state.legend || []).forEach(d => addLegendRow(d));
    document.getElementById('factionRows').innerHTML = '';
    (state.factions || []).forEach(d => addFacRow('factionRows', 'Faction', 'Rôle sur le champ', d));
    document.getElementById('supportRows').innerHTML = '';
    (state.support || []).forEach(d => addFacRow('supportRows', 'Unité de soutien', 'Détail', d));

    if(Array.isArray(state.layers) && state.layers.length){
      layers = state.layers;
    } else {
      layers = [ { name:'Par défaut', visible:true } ];
    }
    activeLayerName = state.activeLayer || (layers[0] && layers[0].name) || 'Par défaut';
    renderLayersUI();
    document.getElementById('mapLayer').innerHTML = '';
    (state.markers || []).forEach(m => makeMarker(m.left, m.top, m.icon ? `url(${m.icon})` : null, m.size, m.layer, m.rotation, m.skew));
    (state.labels || []).forEach(l => makeLabel(l.left, l.top, l.text, l.layer));
    arrowLayer.querySelectorAll('path.arrow-path').forEach(p=>p.remove());
    mapLayer.querySelectorAll('.arrow-handle').forEach(h=>h.remove());
    (state.arrows || []).forEach(a => makeArrow(a.x1, a.y1, a.x2, a.y2, a.type, a.layer, a.rotation, a.skew, a.curveOffset));
    setGridVisible(!!state.gridVisible);

    setPanelVisible('legend', state.legendVisible !== false);
    setPanelVisible('layers', state.layersVisible !== false);
    setPanelVisible('factions', state.factionsVisible !== false);
    setPanelVisible('support', state.supportVisible !== false);

    if(typeof state.font === 'number' && fontCombos[state.font]){ fontSelect.value = state.font; fontSelect.dispatchEvent(new Event('change')); }
    if(typeof state.palette === 'number' && paletteCombos[state.palette]){ paletteSelect.value = state.palette; paletteSelect.dispatchEvent(new Event('change')); }
  }
  // ---------- Startup: offer to recover autosaved work ----------
  (function tryRecoverAutosave(){
    if(!hasAutosave()) return;
    const recovered = loadAutosave();
    if(!recovered) return;
    setTimeout(()=>{
      if(confirm('Une sauvegarde automatique d\'une carte précédente a été trouvée. La recharger maintenant ?\n\n(Clique sur Annuler pour repartir d\'une carte vide.)')){
        loadProject(recovered);
        showToast('Carte récupérée depuis la sauvegarde automatique.');
      }
    }, 50);
  })();

  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
  document.getElementById('loadProjectInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        pushHistory();
        loadProject(JSON.parse(reader.result));
      }
      catch(err){ alert('Fichier de projet invalide.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
</script>

</body>
