<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Grimdark Future — Carte de campagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script>
(function(){
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
  s.onerror = function(){
    var fallback = document.createElement('script');
    fallback.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    document.head.appendChild(fallback);
  };
  document.head.appendChild(s);
})();
</script>
<style>
  :root{
    --bg: #0b0d0e;
    --panel: rgba(18,20,20,0.72);
    --line: rgba(150,175,175,0.28);
    --ink: #d7e4e2;
    --dim: #7d908d;
    --accent: #6fd8c9;
    --accent-dim: rgba(111,216,201,0.35);
    --danger: #c94b4b;
    --font-display: 'Rajdhani', sans-serif;
    --font-body: 'Share Tech Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#000;
    font-family:var(--font-display);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .sheet{
    width:1600px; max-width:100%; aspect-ratio:16/9.2;
    background:var(--bg);
    position:relative; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 6px #000, 0 0 60px rgba(0,0,0,0.8);
  }
  .sheet::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.75) 100%);
  }
  .terrain-slot{
    position:absolute; inset:0; z-index:1; overflow:hidden;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    text-align:center; cursor:pointer;
    filter: grayscale(0.5) contrast(1.05);
  }
  .terrain-slot img{width:100%; height:100%; object-fit:contain; transform-origin:center center; cursor:grab;}
  .terrain-slot img:active{cursor:grabbing;}
  .terrain-slot .hint{
    color:var(--dim); font-size:15px; letter-spacing:2px; text-transform:uppercase;
    border:1px dashed var(--line); padding:22px 34px; font-family:var(--font-body);
  }
  .terrain-slot input{display:none;}

  .map-layer{ position:absolute; inset:0; z-index:4; pointer-events:none; }
  .map-marker{
    position:absolute; width:32px; height:32px; transform:translate(-50%,-50%);
    border:1px solid var(--accent-dim); border-radius:4px; background-color:rgba(11,13,14,0.4);
    cursor:grab; touch-action:none; background-size:cover; background-position:center; background-repeat:no-repeat;
    pointer-events:auto;
  }
  .map-marker:active{cursor:grabbing;}
  .map-marker .row-remove{opacity:0; top:-8px; right:-8px; width:20px; height:20px; background:rgba(11,13,14,0.85); border-radius:50%;}
  .map-marker:hover .row-remove{opacity:0.9;}
  .map-marker.has-icon{ border-color:transparent; background-color:transparent; }
  .map-marker .resize-handle{
    position:absolute; right:-3px; bottom:-3px; width:10px; height:10px;
    background:var(--accent); border:1px solid #0a0e12; cursor:nwse-resize;
    opacity:0; transition:opacity 0.15s; z-index:3;
  }
  .map-marker:hover .resize-handle{opacity:0.9;}
  .resize-handle:hover{opacity:1 !important;}
  .map-label{
    position:absolute; transform:translate(-50%,-50%); z-index:4; pointer-events:auto;
    min-width:20px; max-width:320px; padding:2px 8px;
    font-family:var(--font-display); font-size:18px; color:var(--ink);
    background:rgba(18,20,20,0.6); border:1px solid var(--line); border-radius:2px;
    cursor:grab; touch-action:none; white-space:nowrap;
    text-shadow:0 1px 0 rgba(0,0,0,0.5);
  }
  .map-label:active{cursor:grabbing;}
  .map-label:focus{cursor:text; background:rgba(18,20,20,0.85); outline:1px solid var(--accent);}
  .map-label .row-remove{opacity:0; top:-8px; right:-8px; width:18px; height:18px; background:rgba(10,14,18,0.9); border-radius:50%;}
  .map-label:hover .row-remove{opacity:0.9;}

  header{ position:absolute; top:26px; right:36px; z-index:6; text-align:right; max-width:520px;}
  header .brand{
    font-family:var(--font-body); font-size:11px; color:var(--dim);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:10px;
  }
  h1{
    margin:0; font-family:var(--font-display); font-size:38px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
    color:var(--ink); text-shadow:0 0 18px rgba(111,216,201,0.25);
  }
  .meta{
    font-family:var(--font-body); font-size:11px; color:var(--accent);
    letter-spacing:1px; margin-top:10px; line-height:1.9; opacity:0.85;
  }

  .panel{
    position:absolute; z-index:6; background:var(--panel);
    border:1px solid var(--line); backdrop-filter: blur(2px);
    padding:16px 18px; max-height:calc(100% - 52px); overflow:auto;
  }
  .panel-title{
    font-family:var(--font-body); font-size:12px; color:var(--accent);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:12px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .legend{ top:26px; left:26px; width:300px; }
  .legend-row{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; position:relative; padding-right:18px;}
  .legend-row:last-child{margin-bottom:0;}
  .swatch{ width:22px; height:22px; flex:0 0 auto; margin-top:2px; border:1px solid var(--line); border-radius:50%; }
  .swatch.has-icon{ border-color:transparent; background-color:transparent; }
  .legend-text{flex:1; min-width:0;}
  .legend-text .t{font-size:15px; font-weight:600; letter-spacing:0.5px; font-family:var(--font-display);}
  .legend-text .d{font-size:12.5px; color:var(--dim); line-height:1.35; font-family:var(--font-body);}

  .factions{ left:26px; bottom:26px; width:520px; }
  .faction-grid{ display:flex; flex-wrap:wrap; gap:10px 26px; }
  .fac-row{ display:flex; gap:10px; margin-bottom:6px; align-items:flex-start; position:relative; padding-right:16px; width:calc(50% - 13px);}
  .fac-icon{width:20px; height:20px; flex:0 0 auto; border:1px solid var(--line); margin-top:2px;}
  .fac-icon.has-icon{ border-color:transparent; background-color:transparent; }
  .fac-text{flex:1; min-width:0;}
  .fac-text .t{font-size:14px; font-weight:600; font-family:var(--font-display);}
  .fac-text .d{font-size:11.5px; color:var(--dim); line-height:1.3; font-family:var(--font-body);}

  .support{ right:26px; bottom:26px; width:420px; }
  .sup-grid{ display:flex; flex-wrap:wrap; gap:10px 24px; }
  .support .fac-row{ width:calc(50% - 12px); }

  .icon-slot{
    cursor:pointer; position:relative; overflow:hidden;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    transition:border-color 0.15s;
  }
  .icon-slot:hover{border-color:var(--accent);}
  .icon-slot input{display:none;}
  .icon-slot::after{
    content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:var(--dim); font-family:var(--font-body); pointer-events:none;
  }
  .icon-slot.has-icon::after{content:'';}

  .row-remove{
    position:absolute; top:0; right:0; width:16px; height:16px; z-index:2;
    background:transparent; border:none; color:var(--danger); font-size:15px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s; font-family:var(--font-body);
  }
  .legend-row:hover .row-remove, .fac-row:hover .row-remove{opacity:0.85;}
  .row-remove:hover{opacity:1 !important;}

  .add-row{
    margin-top:12px; width:100%; background:transparent; border:1px dashed var(--accent-dim);
    color:var(--accent); font-family:var(--font-body); font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; padding:8px; cursor:pointer;
  }
  .add-row:hover{background:rgba(111,216,201,0.08); border-color:var(--accent);}

  .panel-close{
    position:absolute; top:8px; right:8px; width:18px; height:18px; z-index:3;
    background:transparent; border:none; color:var(--danger); font-size:16px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s;
  }
  .panel:hover .panel-close{opacity:0.75;}
  .panel-close:hover{opacity:1 !important;}
  .panel.panel-hidden{display:none;}
  .layers-panel{ top:24px; left:340px; width:220px; }
  .layers-panel .layer-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; padding-right:16px; position:relative; }
  .layers-panel .layer-row .lname{ flex:1; font-size:13px; font-family:var(--font-display); }
  .layers-panel .layer-row input[type=checkbox]{ margin:0; }
  .layers-panel .layer-row.active{ background:var(--accent-dim); border-radius:3px; }
  .layers-panel .layer-row .row-remove{ top:0; right:0; }
  .layer-hidden{ display:none !important; }
  .toolbar button.panel-toggle.off{opacity:0.4;}

  .toast{
    position:fixed; bottom:66px; left:50%; transform:translateX(-50%);
    max-width:520px; background:#1a0d0d; color:#ffc2bc; border:1px solid var(--danger);
    padding:10px 18px; font-family:var(--font-body); font-size:12px; line-height:1.5;
    letter-spacing:0.3px; z-index:100; opacity:0; pointer-events:none;
    transition:opacity 0.25s; text-align:center;
  }
  .toast.show{opacity:1;}

  [contenteditable]:empty::before{content:attr(data-ph); color:var(--dim); opacity:0.7;}
  [contenteditable]{outline:none;}
  [contenteditable]:focus{background:rgba(111,216,201,0.06);}

  .toolbar{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:50; font-family:'Share Tech Mono',monospace; align-items:center;
    flex-wrap:wrap; justify-content:center; max-width:96vw;
  }
  .toolbar button, .toolbar select{
    background:#111; color:var(--accent); border:1px solid var(--accent-dim);
    padding:9px 16px; font-family:inherit; font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase; cursor:pointer;
  }
  .toolbar button:hover{background:rgba(111,216,201,0.12);}
  @media print{ .toolbar{display:none;} body{padding:0;} .row-remove, .add-row{display:none;} }
  .sheet.exporting .add-row,
  .sheet.exporting .panel-close,
  .sheet.exporting .row-remove,
  .sheet.exporting .resize-handle,
  .sheet.exporting .map-label .row-remove,
  .sheet.exporting .icon-slot::after{ display:none !important; }
  .sheet.exporting .terrain-slot{ filter:none !important; }
  .sheet.exporting .panel{ backdrop-filter:none !important; }
  .sheet.exporting::before{ opacity:0.45 !important; }
  /* Freeze the sheet at its native pixel size during PNG export so html2canvas
     captures the full 1600x920 canvas regardless of the viewport width.
     html2canvas mis-handles `aspect-ratio` + `max-width:100%`, which caused the
     squashed/stretched exports. */
  .sheet.exporting{
    width:1600px !important;
    max-width:none !important;
    aspect-ratio:auto !important;
    height:920px !important;
    transform:none !important;
  }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <div class="terrain-slot" id="terrainSlot">
    <div class="hint" id="terrainHint">+++ CLIQUER POUR CHARGER LE RELIEF DE TERRAIN +++</div>
    <input type="file" id="terrainInput" accept="image/*">
  </div>

  <div class="map-layer" id="mapLayer"></div>

  <header>
    <div class="brand" contenteditable="true" data-ph="+++ NOM DE CAMPAGNE +++"></div>
    <h1 contenteditable="true" data-ph="SECTEUR ___________"></h1>
    <div class="meta" contenteditable="true" data-ph="+++LOCSCAN: ___+++&#10;+++TOUR / PHASE: ___+++&#10;+++NOTE: ___+++" style="white-space:pre-line;"></div>
  </header>

  <div class="panel legend">
    <button class="panel-close" data-panel="legend" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ LÉGENDE +++"></div>
    <div id="legendRows">
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="legend">+ Ajouter un point remarquable</button>
  </div>

  <div class="panel factions">
    <button class="panel-close" data-panel="factions" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ ALLOCATIONS DES FORCES +++"></div>
    <div class="faction-grid" id="factionRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Faction A"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Faction B"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="faction">+ Ajouter une faction</button>
  </div>

  <div class="panel support">
    <button class="panel-close" data-panel="support" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="+++ SOUTIEN / RÉSERVES +++"></div>
    <div class="sup-grid" id="supportRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Unité de soutien"></div><div class="d" contenteditable="true" data-ph="Détail"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="support">+ Ajouter un soutien</button>
  </div>

  <div class="panel layers-panel panel-hidden" id="layersPanel">
    <button class="panel-close" data-panel="layers" title="Masquer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="Calques">Calques</div>
    <div id="layerRows"></div>
    <button class="add-row" data-add="layer">+ Ajouter un calque</button>
  </div>
</div>

<div class="toolbar">
  <button onclick="window.print()">Imprimer / PDF</button>
  <button id="exportPngBtn">Exporter en PNG</button>
  <button onclick="document.getElementById('terrainInput').click()">Changer le terrain</button>
  <input type="range" id="terrainZoom" min="20" max="300" value="100" title="Échelle du terrain (glisser l'image pour la repositionner)">
  <button id="addMarkerBtn">+ Marqueur</button>
  <button id="addLabelBtn">+ Étiquette</button>
  <button class="panel-toggle" data-panel="legend">Légende</button>
  <button class="panel-toggle" data-panel="layers">Calques</button>
  <select id="activeLayerSelect" title="Calque actif (où placer les nouveaux marqueurs)"></select>
  <button class="panel-toggle" data-panel="factions">Factions</button>
  <button class="panel-toggle" data-panel="support">Soutien</button>
  <select id="fontSelect" title="Police de la carte"></select>
  <select id="paletteSelect" title="Palette de couleurs"></select>
  <button id="saveProjectBtn">Sauvegarder</button>
  <button onclick="document.getElementById('loadProjectInput').click()">Charger</button>
  <button id="newMapBtn" title="Remettre la carte à vide">Nouvelle carte</button>
  <button id="undoBtn" title="Annuler (Ctrl+Z)">↶ Annuler</button>
  <button id="redoBtn" title="Rétablir (Ctrl+Y)">↷ Rétablir</button>
  <input type="file" id="loadProjectInput" accept="application/json,.json" style="display:none">
</div>

<script>
  // ---------- Image loading helper (with format validation) ----------
  function showToast(msg){
    let toast = document.getElementById('toast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(()=> toast.classList.remove('show'), 4500);
  }
  function readImageFile(file, onSuccess){
    const reader = new FileReader();
    reader.onload = ()=>{
      const test = new Image();
      test.onload = ()=> onSuccess(reader.result);
      test.onerror = ()=> showToast(`Format non pris en charge par le navigateur : "${file.name}". Exporte plutôt en PNG ou JPG (les formats TIFF/EXR ne s'affichent pas dans un navigateur).`);
      test.src = reader.result;
    };
    reader.onerror = ()=> showToast(`Impossible de lire le fichier "${file.name}".`);
    reader.readAsDataURL(file);
  }

  // ---------- Terrain background ----------
  const slot = document.getElementById('terrainSlot');
  const input = document.getElementById('terrainInput');
  const hint = document.getElementById('terrainHint');
  const terrainZoom = document.getElementById('terrainZoom');
  let terrainScale = 1, terrainOffsetX = 0, terrainOffsetY = 0, terrainPan = null;

  function updateTerrainTransform(){
    const img = slot.querySelector('img');
    if(img) img.style.transform = `translate(${terrainOffsetX}px, ${terrainOffsetY}px) scale(${terrainScale})`;
  }
  terrainZoom.addEventListener('input', ()=>{
    terrainScale = terrainZoom.value / 100;
    updateTerrainTransform();
  });
  document.addEventListener('pointerdown', e=>{
    const img = e.target.closest('#terrainSlot img');
    if(!img) return;
    terrainPan = { startX:e.clientX, startY:e.clientY, baseX:terrainOffsetX, baseY:terrainOffsetY };
  });
  document.addEventListener('pointermove', e=>{
    if(!terrainPan) return;
    terrainOffsetX = terrainPan.baseX + (e.clientX - terrainPan.startX);
    terrainOffsetY = terrainPan.baseY + (e.clientY - terrainPan.startY);
    updateTerrainTransform();
  });
  document.addEventListener('pointerup', ()=>{ terrainPan = null; });

  slot.addEventListener('click', ()=>{ if(!slot.querySelector('img')) input.click(); });
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    readImageFile(file, dataURL=>{
      pushHistory();
      let img = slot.querySelector('img');
      if(!img){ img = document.createElement('img'); slot.appendChild(img); hint.style.display='none'; }
      img.src = dataURL;
      terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
      terrainZoom.value = 100;
      updateTerrainTransform();
    });
  });
  slot.addEventListener('dragover', e=>{e.preventDefault();});
  slot.addEventListener('drop', e=>{
    e.preventDefault();
    const bg = e.dataTransfer.getData('text/plain');
    if(bg && bg.startsWith('url(')){
      const rect = slot.getBoundingClientRect();
      const leftPct = ((e.clientX - rect.left) / rect.width) * 100;
      const topPct = ((e.clientY - rect.top) / rect.height) * 100;
      pushHistory();
      makeMarker(leftPct, topPct, bg);
      return;
    }
    const file = e.dataTransfer.files[0];
    if(file){ input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
  });

  // ---------- Row builders ----------
  function applyRowData(row, data){
    if(!data) return;
    const iconSlot = row.querySelector('.icon-slot');
    if(data.icon){ iconSlot.style.backgroundImage = `url(${data.icon})`; iconSlot.classList.add('has-icon'); iconSlot.draggable = true; }
    if(data.t !== undefined) row.querySelector('.t').innerHTML = data.t;
    if(data.d !== undefined) row.querySelector('.d').innerHTML = data.d;
  }
  function addLegendRow(data){
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>`;
    document.getElementById('legendRows').appendChild(row);
    applyRowData(row, data);
    return row;
  }
  function addFacRow(containerId, nameHint, detailHint, data){
    const row = document.createElement('div');
    row.className = 'fac-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="fac-text"><div class="t" contenteditable="true" data-ph="${nameHint}"></div><div class="d" contenteditable="true" data-ph="${detailHint}"></div></div>`;
    document.getElementById(containerId).appendChild(row);
    applyRowData(row, data);
    return row;
  }

  // ---------- Markers on the map ----------
  const mapLayer = document.getElementById('mapLayer');
  // ---------- Layers (marker groups) ----------
  let layers = [ { name:'Par défaut', visible:true } ];
  let activeLayerName = 'Par défaut';
  const layerRowsEl = document.getElementById('layerRows');
  const activeLayerSelect = document.getElementById('activeLayerSelect');

  function renderLayersUI(){
    activeLayerSelect.innerHTML = '';
    layers.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = l.name; opt.textContent = l.name;
      if(l.name === activeLayerName) opt.selected = true;
      activeLayerSelect.appendChild(opt);
    });
    layerRowsEl.innerHTML = '';
    layers.forEach(l=>{
      const row = document.createElement('div');
      row.className = 'layer-row' + (l.name === activeLayerName ? ' active' : '');
      row.innerHTML = `<input type="checkbox" ${l.visible ? 'checked' : ''} title="Afficher/Masquer">
        <span class="lname" contenteditable="true" data-ph="Nom du calque">${l.name}</span>
        <button class="row-remove" title="Supprimer le calque">×</button>`;
      const cb = row.querySelector('input[type=checkbox]');
      const nameEl = row.querySelector('.lname');
      row.addEventListener('click', e=>{
        if(e.target === cb || e.target.closest('.row-remove') || e.target === nameEl) return;
        setActiveLayer(l.name);
      });
      cb.addEventListener('change', ()=>{
        l.visible = cb.checked;
        applyLayerVisibility();
        scheduleAutosave();
      });
      nameEl.addEventListener('blur', ()=>{
        const newName = nameEl.textContent.trim() || l.name;
        if(newName !== l.name){
          const oldName = l.name;
          l.name = newName;
          document.querySelectorAll(`#mapLayer .map-marker[data-layer="${cssEscape(oldName)}"]`).forEach(m=>{ m.dataset.layer = newName; });
          document.querySelectorAll(`#mapLayer .map-label[data-layer="${cssEscape(oldName)}"]`).forEach(m=>{ m.dataset.layer = newName; });
          if(activeLayerName === oldName) activeLayerName = newName;
          renderLayersUI();
          scheduleAutosave();
        }
      });
      layerRowsEl.appendChild(row);
    });
  }
  function cssEscape(str){ return String(str).replace(/["\\]/g, '\\$&'); }
  function setActiveLayer(name){ activeLayerName = name; renderLayersUI(); }
  function applyLayerVisibility(){
    document.querySelectorAll('#mapLayer .map-marker, #mapLayer .map-label').forEach(m=>{
      const ln = m.dataset.layer || 'Par défaut';
      const layer = layers.find(l=>l.name === ln) || { visible:true };
      m.classList.toggle('layer-hidden', !layer.visible);
    });
  }
  activeLayerSelect.addEventListener('change', ()=>{ activeLayerName = activeLayerSelect.value; renderLayersUI(); });
  renderLayersUI();

  // Marker that was just dragged; its following click (the browser synthesizes
  // one after pointerup) must be swallowed so it doesn't open the file picker.
  let justDraggedMarker = null;
  let dragState = null;

  function makeMarker(leftPct, topPct, bgImage, size, layer){
    const marker = document.createElement('div');
    marker.className = 'map-marker icon-slot' + (bgImage ? ' has-icon' : '');
    marker.style.left = leftPct + '%';
    marker.style.top = topPct + '%';
    marker.dataset.layer = layer || activeLayerName;
    if(size){ marker.style.width = size + 'px'; marker.style.height = size + 'px'; }
    if(bgImage){ marker.style.backgroundImage = bgImage; }
    marker.innerHTML = '<input type="file" class="icon-input" accept="image/*"><button class="row-remove" title="Supprimer">×</button><div class="resize-handle" title="Redimensionner"></div>';
    mapLayer.appendChild(marker);
    applyLayerVisibility();
    return marker;
  }
  document.getElementById('addMarkerBtn').addEventListener('click', ()=>{ pushHistory(); makeMarker(50, 50, null); });
  // ---------- Free-text labels on the map ----------
  function makeLabel(leftPct, topPct, text, layer){
    const label = document.createElement('div');
    label.className = 'map-label';
    label.setAttribute('contenteditable', 'true');
    label.style.left = leftPct + '%';
    label.style.top = topPct + '%';
    label.dataset.layer = layer || activeLayerName;
    label.innerHTML = '<button class="row-remove" title="Supprimer">×</button>';
    const span = document.createElement('span');
    span.textContent = text || '';
    label.appendChild(span);
    mapLayer.appendChild(label);

    return label;
  }
  document.getElementById('addLabelBtn').addEventListener('click', ()=>{
    pushHistory();

  function serializeLabel(label){
    const span = label.querySelector('span');
    return {
      left: parseFloat(label.style.left),
      top: parseFloat(label.style.top),
      text: span ? span.innerHTML : '',
      layer: label.dataset.layer || activeLayerName
    };
  }

  let resizeState = null;
  document.addEventListener('pointerdown', e=>{
    if(e.target.closest('.resize-handle')){
      const marker = e.target.closest('.map-marker');
      if(!marker) return;
      e.preventDefault();
      const startW = parseFloat(getComputedStyle(marker).width) || 32;
      resizeState = { marker, startX:e.clientX, startW, moved:false };
      return;
    }
    const marker = e.target.closest('.map-marker, .map-label');
    if(!marker || e.target.closest('.row-remove')) return;
    // A contenteditable label is dragged only while Shift is held; otherwise the
    // click places the caret for text editing.
    if(marker.classList.contains('map-label') && !e.shiftKey) return;
    if(marker.isContentEditable){ marker.blur(); }
    dragState = { marker, startX:e.clientX, startY:e.clientY, moved:false, rect: marker.closest('.sheet').getBoundingClientRect() };
  });
  document.addEventListener('pointermove', e=>{
    if(resizeState){
      const dx = e.clientX - resizeState.startX;
      const newW = Math.max(16, Math.min(200, resizeState.startW + dx));
      resizeState.marker.style.width = newW + 'px';
      resizeState.marker.style.height = newW + 'px';
      if(Math.abs(dx) > 2 && !resizeState.moved){ resizeState.moved = true; pushHistory(); }
      return;
    }
    if(!dragState) return;
    const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
      if(!dragState.moved){ dragState.moved = true; pushHistory(); }
    }
    if(dragState.moved){
      const r = dragState.rect;
      let leftPct = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100));
      let topPct = Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100));
      dragState.marker.style.left = leftPct + '%';
      dragState.marker.style.top = topPct + '%';
    }
  });
  document.addEventListener('pointerup', ()=>{
    if(resizeState && resizeState.moved){ justDraggedMarker = resizeState.marker; }
    resizeState = null;
    if(dragState && dragState.moved){ justDraggedMarker = dragState.marker; }
    dragState = null;
  });

  document.addEventListener('contextmenu', e=>{
    const marker = e.target.closest('.map-marker');

    pushHistory();

  document.addEventListener('click', function(e){
    const panelClose = e.target.closest('.panel-close');
    if(panelClose){ togglePanel(panelClose.dataset.panel); return; }

    if(panelToggle){ togglePanel(panelToggle.dataset.panel); return; }

    const iconSlot = e.target.closest('.icon-slot');
    if(iconSlot){
      if(justDraggedMarker && iconSlot === justDraggedMarker){
        justDraggedMarker = null;
        return;
      }
      justDraggedMarker = null;
      // Alt+click on a marker duplicates it (offset slightly so both are visible).
      if(e.altKey && iconSlot.classList.contains('map-marker')){
        pushHistory();
        const left = parseFloat(iconSlot.style.left) + 3;
        const top  = parseFloat(iconSlot.style.top) + 3;
        const bg = iconSlot.style.backgroundImage || null;

  document.addEventListener('drop', e=>{

    }

  // ---------- Undo history ----------
  // Snapshots of the full project state, captured BEFORE each mutating action
  // (add/remove row, marker drag, image load). Undo restores the previous one.
  const undoStack = [];
  const redoStack = [];
  const UNDO_LIMIT = 50;

  function captureState(){
    const terrainImg = document.querySelector('.terrain-slot img');
    return {
      version: 1,
      template: 'gf',
      brand: document.querySelector('header .brand').innerHTML,
      title: document.querySelector('header h1').innerHTML,
      meta: document.querySelector('header .meta').innerHTML,
      terrain: terrainImg ? terrainImg.src : null,
      terrainScale: terrainScale,
      terrainOffsetX: terrainOffsetX,
      terrainOffsetY: terrainOffsetY,
      legendTitle: document.querySelector('.legend .panel-title').innerHTML,
      legend: Array.from(document.querySelectorAll('#legendRows .legend-row')).map(serializeRow),
      factionTitle: document.querySelector('.factions .panel-title').innerHTML,
      factions: Array.from(document.querySelectorAll('#factionRows .fac-row')).map(serializeRow),
      supportTitle: document.querySelector('.support .panel-title').innerHTML,
      support: Array.from(document.querySelectorAll('#supportRows .fac-row')).map(serializeRow),
      layers: layers.map(l=>({name:l.name, visible:l.visible})),
      activeLayer: activeLayerName,
      layersVisible: !document.querySelector('.layers-panel').classList.contains('panel-hidden'),
      labels: Array.from(document.querySelectorAll('#mapLayer .map-label')).map(serializeLabel),
      markers: Array.from(document.querySelectorAll('#mapLayer .map-marker')).map(serializeMarker),
      legendVisible: !document.querySelector('.legend').classList.contains('panel-hidden'),
      factionsVisible: !document.querySelector('.factions').classList.contains('panel-hidden'),
      supportVisible: !document.querySelector('.support').classList.contains('panel-hidden'),
      font: parseInt(fontSelect.value || 0),
      palette: parseInt(paletteSelect.value || 0)
    };
  }
  function pushHistory(){
    undoStack.push(captureState());
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack.length = 0; // a new action invalidates the redo branch
    updateUndoBtn();
  }
  function updateUndoBtn(){
    const u = document.getElementById('undoBtn');
    if(u) u.disabled = undoStack.length === 0;
    const r = document.getElementById('redoBtn');
    if(r) r.disabled = redoStack.length === 0;
  }
  function undo(){
    if(undoStack.length === 0) return;
    const entry = undoStack[undoStack.length-1];
    // Text-restore entries are handled inline (no full project reload).
    if(entry && entry.__textRestore){
      redoStack.push(captureState());
      const e = undoStack.pop();
      const cur = e.el.innerHTML;
      e.el.innerHTML = e.prev;
      e.prev = cur; // swap so a subsequent redo restores the edited version
      updateUndoBtn();
      scheduleAutosave();
      return;
    }
    redoStack.push(captureState());
    const prev = undoStack.pop();
    loadProject(prev);
    updateUndoBtn();
  }
  function redo(){
    if(redoStack.length === 0) return;
    const entry = redoStack[redoStack.length-1];
    if(entry && entry.__textRestore){
      undoStack.push(captureState());
      const e = redoStack.pop();
      const cur = e.el.innerHTML;
      e.el.innerHTML = e.prev;
      e.prev = cur;
      updateUndoBtn();
      scheduleAutosave();
      return;
    }
    undoStack.push(captureState());
    const next = redoStack.pop();
    loadProject(next);
    updateUndoBtn();
  }

  // ---------- Autosave to localStorage ----------
  const AUTOSAVE_KEY = 'gf-campaign-map-autosave';
  let autosaveTimer = null;
  function autosave(){
    try{ localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(captureState())); }
    catch(err){ /* storage may be full (base64 images) or disabled: stay silent */ }
  }
  function scheduleAutosave(){
    if(autosaveTimer) clearTimeout(autosaveTimer);
    autosaveTimer = setTimeout(autosave, 800); // debounce
  }
  // Patch pushHistory so every undoable action also schedules an autosave.
  const _origPushHistory = pushHistory;
  pushHistory = function(){ _origPushHistory(); scheduleAutosave(); };
  document.addEventListener('input', e=>{
    if(e.target.isContentEditable) scheduleAutosave();
  });
  // ---------- Undo for contenteditable text edits ----------
  let textEditSnapshot = null;
  document.addEventListener('focusin', e=>{
    if(e.target.isContentEditable){ textEditSnapshot = { el: e.target, html: e.target.innerHTML }; }
  });
  document.addEventListener('focusout', e=>{
    if(!textEditSnapshot || e.target !== textEditSnapshot.el) return;
    if(e.target.innerHTML !== textEditSnapshot.html){
      const prev = textEditSnapshot.html;
      const el = e.target;
      undoStack.push({ __textRestore: true, el, prev });
      if(undoStack.length > UNDO_LIMIT) undoStack.shift();
      redoStack.length = 0;
      updateUndoBtn();
    }
    textEditSnapshot = null;
  });
  function loadAutosave(){
    try{
      const raw = localStorage.getItem(AUTOSAVE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(err){ return null; }
  }
  function hasAutosave(){ return !!localStorage.getItem(AUTOSAVE_KEY); }

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if(!(e.ctrlKey || e.metaKey)) return;
    // Allow undo/redo even inside contenteditable (text-edit undo is supported).
    // Only block native browser undo for actual <input>/<textarea> form fields.
    const isForm = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    if(k === 'z' && !e.shiftKey){ if(!isForm){ e.preventDefault(); undo(); } }
    else if((k === 'z' && e.shiftKey) || k === 'y'){ if(!isForm){ e.preventDefault(); redo(); } }
  });
  updateUndoBtn();

  // ---------- Export to PNG ----------
  function pinCssVarsForExport(){
    const root = document.documentElement;
    const computed = getComputedStyle(root);
    const varNames = ['--bg','--panel','--line','--ink','--dim','--accent','--accent-dim','--danger','--font-display','--font-body'];
    let css = '#sheet, #sheet *{';
    varNames.forEach(v=>{ css += `${v}: ${computed.getPropertyValue(v).trim()} !important;`; });
    css += '}';
    const styleEl = document.createElement('style');
    styleEl.id = 'exportVarOverride';
    styleEl.textContent = css;
    document.head.appendChild(styleEl);
  }
  function unpinCssVarsForExport(){
    const el = document.getElementById('exportVarOverride');
    if(el) el.remove();
  }
  async function exportPng(){
    if(typeof html2canvas === 'undefined'){
      showToast("La bibliothèque d'export image n'a pas pu se charger (connexion internet ?). Réessaie, ou utilise \"Imprimer / PDF\".");
      return;
    }
    const sheetEl = document.getElementById('sheet');
    sheetEl.classList.add('exporting');
    pinCssVarsForExport();
    try{
      // Capture the native size explicitly: html2canvas struggles with
      // aspect-ratio, so we pass fixed width/height to avoid squashing.
      const canvas = await html2canvas(sheetEl, { backgroundColor: null, scale: 2, width: 1600, height: 920, windowWidth: 1600, windowHeight: 920 });
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const rawTitle = (document.querySelector('header h1').innerText || 'carte-gf').trim();
        a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-gf') + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    } catch(err){
      showToast("Erreur lors de l'export en image. Réessaie, ou utilise \"Imprimer / PDF\".");
    } finally {
      sheetEl.classList.remove('exporting');
      unpinCssVarsForExport();
    }
  }
  document.getElementById('exportPngBtn').addEventListener('click', exportPng);

  // ---------- Save / Load project ----------
  function urlFromBg(bg){
    if(!bg) return null;
    const m = bg.match(/^url\((['"]?)(.*)\1\)$/);
    return m ? m[2] : null;
  }
  function serializeRow(row){
    const iconSlot = row.querySelector('.icon-slot');
    return {
      icon: urlFromBg(iconSlot.style.backgroundImage),
      t: row.querySelector('.t').innerHTML,

  function serializeMarker(marker){
    const w = parseFloat(marker.style.width);
    return {
      left: parseFloat(marker.style.left),
      top: parseFloat(marker.style.top),
      size: isNaN(w) ? null : w,
      layer: marker.dataset.layer || activeLayerName,
      icon: urlFromBg(marker.style.backgroundImage)
    };
  }
  function saveProject(){
    const terrainImg = document.querySelector('.terrain-slot img');
    const state = {
      version: 1,
      template: 'gf',
      brand: document.querySelector('header .brand').innerHTML,
      title: document.querySelector('header h1').innerHTML,
      meta: document.querySelector('header .meta').innerHTML,
      terrain: terrainImg ? terrainImg.src : null,
      terrainScale: terrainScale,
      terrainOffsetX: terrainOffsetX,
      terrainOffsetY: terrainOffsetY,
      legendTitle: document.querySelector('.legend .panel-title').innerHTML,
      legend: Array.from(document.querySelectorAll('#legendRows .legend-row')).map(serializeRow),
      factionTitle: document.querySelector('.factions .panel-title').innerHTML,
      factions: Array.from(document.querySelectorAll('#factionRows .fac-row')).map(serializeRow),
      supportTitle: document.querySelector('.support .panel-title').innerHTML,
      support: Array.from(document.querySelectorAll('#supportRows .fac-row')).map(serializeRow),
      layers: layers.map(l=>({name:l.name, visible:l.visible})),
      activeLayer: activeLayerName,
      layersVisible: !document.querySelector('.layers-panel').classList.contains('panel-hidden'),
      labels: Array.from(document.querySelectorAll('#mapLayer .map-label')).map(serializeLabel),
      markers: Array.from(document.querySelectorAll('#mapLayer .map-marker')).map(serializeMarker),
      legendVisible: !document.querySelector('.legend').classList.contains('panel-hidden'),
      factionsVisible: !document.querySelector('.factions').classList.contains('panel-hidden'),
      supportVisible: !document.querySelector('.support').classList.contains('panel-hidden'),
      font: parseInt(fontSelect.value || 0),
      palette: parseInt(paletteSelect.value || 0)
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const rawTitle = (document.querySelector('header h1').innerText || 'carte-projet-gf').trim();
    a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-projet-gf') + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function loadProject(state){
    document.querySelector('header .brand').innerHTML = state.brand || '';
    document.querySelector('header h1').innerHTML = state.title || '';
    document.querySelector('header .meta').innerHTML = state.meta || '';
    if(state.terrain){
      let img = document.querySelector('.terrain-slot img');
      if(!img){ img = document.createElement('img'); document.getElementById('terrainSlot').appendChild(img); }
      img.src = state.terrain;
      hint.style.display = 'none';
      terrainScale = typeof state.terrainScale === 'number' ? state.terrainScale : 1;
      terrainOffsetX = typeof state.terrainOffsetX === 'number' ? state.terrainOffsetX : 0;
      terrainOffsetY = typeof state.terrainOffsetY === 'number' ? state.terrainOffsetY : 0;
      terrainZoom.value = Math.round(terrainScale * 100);
      updateTerrainTransform();
    } else {
      // No terrain in the project: ensure the hint is visible again and remove
      // any previously loaded terrain image.
      const img = document.querySelector('.terrain-slot img');
      if(img){ img.remove(); }
      hint.style.display = '';
      terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
      terrainZoom.value = 100;
      updateTerrainTransform();
    }
    if(state.legendTitle !== undefined) document.querySelector('.legend .panel-title').innerHTML = state.legendTitle;
    if(state.factionTitle !== undefined) document.querySelector('.factions .panel-title').innerHTML = state.factionTitle;
    if(state.supportTitle !== undefined) document.querySelector('.support .panel-title').innerHTML = state.supportTitle;

    document.getElementById('legendRows').innerHTML = '';
    (state.legend || []).forEach(d => addLegendRow(d));
    document.getElementById('factionRows').innerHTML = '';
    (state.factions || []).forEach(d => addFacRow('factionRows', 'Faction', 'Rôle sur le champ', d));
    document.getElementById('supportRows').innerHTML = '';
    (state.support || []).forEach(d => addFacRow('supportRows', 'Unité de soutien', 'Détail', d));

    if(Array.isArray(state.layers) && state.layers.length){
      layers = state.layers;
    } else {
      layers = [ { name:'Par défaut', visible:true } ];
    }
    activeLayerName = state.activeLayer || (layers[0] && layers[0].name) || 'Par défaut';
    renderLayersUI();
    document.getElementById('mapLayer').innerHTML = '';
    (state.markers || []).forEach(m => makeMarker(m.left, m.top, m.icon ? `url(${m.icon})` : null, m.size, m.layer));
    (state.labels || []).forEach(l => makeLabel(l.left, l.top, l.text, l.layer));

    setPanelVisible('legend', state.legendVisible !== false);
    setPanelVisible('layers', state.layersVisible !== false);
    setPanelVisible('factions', state.factionsVisible !== false);
    setPanelVisible('support', state.supportVisible !== false);

    if(typeof state.font === 'number' && fontCombos[state.font]){ fontSelect.value = state.font; fontSelect.dispatchEvent(new Event('change')); }
    if(typeof state.palette === 'number' && paletteCombos[state.palette]){ paletteSelect.value = state.palette; paletteSelect.dispatchEvent(new Event('change')); }
  }
  // ---------- Startup: offer to recover autosaved work ----------
  (function tryRecoverAutosave(){
    if(!hasAutosave()) return;
    const recovered = loadAutosave();
    if(!recovered) return;
    setTimeout(()=>{
      if(confirm('Une sauvegarde automatique d\'une carte précédente a été trouvée. La recharger maintenant ?\n\n(Clique sur Annuler pour repartir d\'une carte vide.)')){
        loadProject(recovered);
        showToast('Carte récupérée depuis la sauvegarde automatique.');
      }
    }, 50);
  })();

  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
  document.getElementById('loadProjectInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        pushHistory();
        loadProject(JSON.parse(reader.result));
      }
      catch(err){ alert('Fichier de projet invalide.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
</script>
