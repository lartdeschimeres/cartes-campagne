<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Age of Fantasy — Carte de campagne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link id="fontLink" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --parchment: #d8c9a6;
    --parchment-dark: #c3b088;
    --panel: rgba(35,28,18,0.7);
    --ink: #2a2119;
    --ink-soft: #4a3d2c;
    --line: rgba(60,45,25,0.4);
    --wax: #7a2b26;
    --olive: #5c5f3a;
    --gold: #a9863f;
    --font-display: 'IM Fell English', serif;
    --font-body: 'EB Garamond', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#141008;
    font-family:var(--font-body); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
  }
  .sheet{
    width:1600px; max-width:100%; aspect-ratio:16/9.2;
    background:var(--parchment);
    position:relative; overflow:hidden;
    border:10px solid #241a10;
    box-shadow:0 0 0 1px #5a4224 inset, 0 0 60px rgba(0,0,0,0.85);
  }
  .sheet::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(40,28,12,0.55) 100%);
    mix-blend-mode:multiply;
  }
  .sheet::after{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:5;
    background-image:
      repeating-radial-gradient(circle at 20% 30%, rgba(90,66,36,0.05) 0, transparent 3px),
      repeating-radial-gradient(circle at 70% 80%, rgba(90,66,36,0.05) 0, transparent 4px);
    opacity:0.6;
  }
  .terrain-slot{
    position:absolute; inset:0; z-index:1; overflow:hidden;
    background:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    text-align:center; cursor:pointer;
    filter: sepia(0.25) contrast(1.02);
  }
  .terrain-slot img{width:100%; height:100%; object-fit:cover; transform-origin:center center; cursor:grab;}
  .terrain-slot img:active{cursor:grabbing;}
  .terrain-slot .hint{
    color:var(--ink-soft); font-size:16px; letter-spacing:1px;
    font-style:italic; border:1px dashed var(--line); padding:22px 34px; font-family:var(--font-body);
  }
  .terrain-slot input{display:none;}

  .map-layer{ position:absolute; inset:0; z-index:4; }
  .map-marker{
    position:absolute; width:32px; height:32px; transform:translate(-50%,-50%);
    border:1px solid var(--gold); border-radius:2px; background-color:rgba(35,28,18,0.4);
    cursor:grab; touch-action:none; background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  .map-marker:active{cursor:grabbing;}
  .map-marker .row-remove{opacity:0; top:-8px; right:-8px; width:20px; height:20px; background:rgba(35,28,18,0.9); border-radius:50%;}
  .map-marker:hover .row-remove{opacity:0.9;}
  .map-marker.has-icon{ border-color:transparent; background-color:transparent; }

  header{ position:absolute; top:24px; right:36px; z-index:6; text-align:right; max-width:520px;}
  header .brand{
    font-family:var(--font-body); font-size:12px; color:var(--wax);
    letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; font-weight:600;
  }
  h1{
    margin:0; font-family:var(--font-display); font-weight:400;
    font-size:46px; letter-spacing:1px; color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,0.25);
  }
  .meta{
    font-family:var(--font-body); font-size:13px; color:var(--ink-soft);
    letter-spacing:0.5px; margin-top:8px; line-height:1.8; font-style:italic;
  }

  .panel{
    position:absolute; z-index:6; background:var(--panel);
    border:1px solid #6b4e28; padding:16px 20px;
    color:#e9dfc6; max-height:calc(100% - 48px); overflow:auto;
  }
  .panel-title{
    font-family:var(--font-display); font-size:20px; color:var(--gold);
    letter-spacing:1px; margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid rgba(169,134,63,0.4);
  }
  .legend{ top:24px; left:24px; width:300px; }
  .legend-row{ display:flex; gap:10px; margin-bottom:12px; align-items:flex-start; position:relative; padding-right:18px;}
  .legend-row:last-child{margin-bottom:0;}
  .swatch{ width:22px; height:22px; flex:0 0 auto; margin-top:2px; border:1px solid var(--gold); border-radius:2px; transform:rotate(45deg); }
  .swatch.has-icon{ border-color:transparent; background-color:transparent; }
  .legend-text{flex:1; min-width:0;}
  .legend-text .t{font-size:15px; font-weight:600; font-family:var(--font-display);}
  .legend-text .d{font-size:12.5px; color:#c9bda1; line-height:1.35; font-style:italic; font-family:var(--font-body);}

  .factions{ left:24px; bottom:24px; width:520px; }
  .faction-grid{ display:flex; flex-wrap:wrap; gap:10px 26px; }
  .fac-row{ display:flex; gap:10px; margin-bottom:6px; align-items:flex-start; position:relative; padding-right:16px; width:calc(50% - 13px);}
  .fac-icon{width:20px; height:20px; flex:0 0 auto; border:1px solid var(--gold); margin-top:2px;}
  .fac-icon.has-icon{ border-color:transparent; background-color:transparent; }
  .fac-text{flex:1; min-width:0;}
  .fac-text .t{font-size:14px; font-weight:600; font-family:var(--font-display);}
  .fac-text .d{font-size:11.5px; color:#c9bda1; line-height:1.3; font-style:italic; font-family:var(--font-body);}

  .support{ right:24px; bottom:24px; width:420px; }
  .sup-grid{ display:flex; flex-wrap:wrap; gap:10px 24px; }
  .support .fac-row{ width:calc(50% - 12px); }

  .icon-slot{
    cursor:pointer; position:relative; overflow:hidden;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    transition:border-color 0.15s;
  }
  .icon-slot:hover{border-color:#e9dfc6;}
  .icon-slot input{display:none;}
  .icon-slot::after{
    content:'+'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#9a8b6a; font-family:var(--font-body); pointer-events:none;
  }
  .icon-slot.has-icon::after{content:'';}

  .row-remove{
    position:absolute; top:0; right:0; width:16px; height:16px; z-index:2;
    background:transparent; border:none; color:var(--wax); font-size:15px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s; font-family:var(--font-body);
  }
  .legend-row:hover .row-remove, .fac-row:hover .row-remove{opacity:0.85;}
  .row-remove:hover{opacity:1 !important;}

  .add-row{
    margin-top:12px; width:100%; background:transparent; border:1px dashed var(--gold);
    color:var(--gold); font-family:var(--font-body); font-size:12px; letter-spacing:1px;
    padding:8px; cursor:pointer;
  }
  .add-row:hover{background:rgba(169,134,63,0.12);}

  .panel-close{
    position:absolute; top:8px; right:8px; width:18px; height:18px; z-index:3;
    background:transparent; border:none; color:var(--wax); font-size:16px; line-height:1;
    cursor:pointer; opacity:0; transition:opacity 0.15s;
  }
  .panel:hover .panel-close{opacity:0.75;}
  .panel-close:hover{opacity:1 !important;}
  .panel.panel-hidden{display:none;}
  .toolbar button.panel-toggle.off{opacity:0.4;}

  .toast{
    position:fixed; bottom:66px; left:50%; transform:translateX(-50%);
    max-width:520px; background:#1a1006; color:#f0d9b0; border:1px solid var(--wax);
    padding:10px 18px; font-family:var(--font-body); font-size:12px; line-height:1.5;
    letter-spacing:0.3px; z-index:100; opacity:0; pointer-events:none;
    transition:opacity 0.25s; text-align:center;
  }
  .toast.show{opacity:1;}

  [contenteditable]:empty::before{content:attr(data-ph); color:#9a8b6a; opacity:0.8;}
  [contenteditable]{outline:none;}
  [contenteditable]:focus{background:rgba(169,134,63,0.12);}

  .toolbar{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:10px; z-index:50; font-family:'EB Garamond',serif; align-items:center;
    flex-wrap:wrap; justify-content:center; max-width:96vw;
  }
  .toolbar button, .toolbar select{
    background:#241a10; color:var(--gold); border:1px solid var(--gold);
    padding:9px 16px; font-family:inherit; font-size:13px; letter-spacing:1px;
    cursor:pointer;
  }
  .toolbar button:hover{background:#372716;}
  @media print{ .toolbar{display:none;} body{padding:0;} .row-remove, .add-row{display:none;} }
  .sheet.exporting .add-row,
  .sheet.exporting .panel-close,
  .sheet.exporting .row-remove,
  .sheet.exporting .icon-slot::after{ display:none !important; }
</style>
</head>
<body>

<div class="sheet" id="sheet">
  <div class="terrain-slot" id="terrainSlot">
    <div class="hint" id="terrainHint">+++ Cliquer pour charger le relief de terrain +++</div>
    <input type="file" id="terrainInput" accept="image/*">
  </div>

  <div class="map-layer" id="mapLayer"></div>

  <header>
    <div class="brand" contenteditable="true" data-ph="Chronique de campagne"></div>
    <h1 contenteditable="true" data-ph="Province de ___________"></h1>
    <div class="meta" contenteditable="true" data-ph="Position: ___&#10;Saison / Tour: ___&#10;Note: ___" style="white-space:pre-line;"></div>
  </header>

  <div class="panel legend">
    <button class="panel-close" data-panel="legend" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="Légende"></div>
    <div id="legendRows">
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
      <div class="legend-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="legend">+ Ajouter un point remarquable</button>
  </div>

  <div class="panel factions">
    <button class="panel-close" data-panel="factions" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="Forces en présence"></div>
    <div class="faction-grid" id="factionRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Royaume / Armée A"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Royaume / Armée B"></div><div class="d" contenteditable="true" data-ph="Rôle sur le champ"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="faction">+ Ajouter une armée</button>
  </div>

  <div class="panel support">
    <button class="panel-close" data-panel="support" title="Supprimer le panneau">×</button>
    <div class="panel-title" contenteditable="true" data-ph="Renforts / Alliés"></div>
    <div class="sup-grid" id="supportRows">
      <div class="fac-row">
        <button class="row-remove" title="Supprimer">×</button>
        <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
        <div class="fac-text"><div class="t" contenteditable="true" data-ph="Unité alliée"></div><div class="d" contenteditable="true" data-ph="Détail"></div></div>
      </div>
    </div>
    <button class="add-row" data-add="support">+ Ajouter un renfort</button>
  </div>
</div>

<div class="toolbar">
  <button onclick="window.print()">Imprimer / PDF</button>
  <button id="exportPngBtn">Exporter en PNG</button>
  <button onclick="document.getElementById('terrainInput').click()">Changer le terrain</button>
  <input type="range" id="terrainZoom" min="20" max="300" value="100" title="Échelle du terrain (glisser l'image pour la repositionner)">
  <button id="addMarkerBtn">+ Marqueur</button>
  <button class="panel-toggle" data-panel="legend">Légende</button>
  <button class="panel-toggle" data-panel="factions">Factions</button>
  <button class="panel-toggle" data-panel="support">Soutien</button>
  <select id="fontSelect" title="Police de la carte"></select>
  <select id="paletteSelect" title="Palette de couleurs"></select>
  <button id="saveProjectBtn">Sauvegarder</button>
  <button onclick="document.getElementById('loadProjectInput').click()">Charger</button>
  <input type="file" id="loadProjectInput" accept="application/json,.json" style="display:none">
</div>

<script>
  // ---------- Image loading helper (with format validation) ----------
  function showToast(msg){
    let toast = document.getElementById('toast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(()=> toast.classList.remove('show'), 4500);
  }
  function readImageFile(file, onSuccess){
    const reader = new FileReader();
    reader.onload = ()=>{
      const test = new Image();
      test.onload = ()=> onSuccess(reader.result);
      test.onerror = ()=> showToast(`Format non pris en charge par le navigateur : "${file.name}". Exporte plutôt en PNG ou JPG (les formats TIFF/EXR ne s'affichent pas dans un navigateur).`);
      test.src = reader.result;
    };
    reader.onerror = ()=> showToast(`Impossible de lire le fichier "${file.name}".`);
    reader.readAsDataURL(file);
  }

  // ---------- Terrain background ----------
  const slot = document.getElementById('terrainSlot');
  const input = document.getElementById('terrainInput');
  const hint = document.getElementById('terrainHint');
  const terrainZoom = document.getElementById('terrainZoom');
  let terrainScale = 1, terrainOffsetX = 0, terrainOffsetY = 0, terrainPan = null;

  function updateTerrainTransform(){
    const img = slot.querySelector('img');
    if(img) img.style.transform = `translate(${terrainOffsetX}px, ${terrainOffsetY}px) scale(${terrainScale})`;
  }
  terrainZoom.addEventListener('input', ()=>{
    terrainScale = terrainZoom.value / 100;
    updateTerrainTransform();
  });
  document.addEventListener('pointerdown', e=>{
    const img = e.target.closest('#terrainSlot img');
    if(!img) return;
    terrainPan = { startX:e.clientX, startY:e.clientY, baseX:terrainOffsetX, baseY:terrainOffsetY };
  });
  document.addEventListener('pointermove', e=>{
    if(!terrainPan) return;
    terrainOffsetX = terrainPan.baseX + (e.clientX - terrainPan.startX);
    terrainOffsetY = terrainPan.baseY + (e.clientY - terrainPan.startY);
    updateTerrainTransform();
  });
  document.addEventListener('pointerup', ()=>{ terrainPan = null; });

  slot.addEventListener('click', ()=>{ if(!slot.querySelector('img')) input.click(); });
  input.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    readImageFile(file, dataURL=>{
      let img = slot.querySelector('img');
      if(!img){ img = document.createElement('img'); slot.appendChild(img); hint.style.display='none'; }
      img.src = dataURL;
      terrainScale = 1; terrainOffsetX = 0; terrainOffsetY = 0;
      terrainZoom.value = 100;
      updateTerrainTransform();
    });
  });
  slot.addEventListener('dragover', e=>{e.preventDefault();});
  slot.addEventListener('drop', e=>{
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if(file){ input.files = e.dataTransfer.files; input.dispatchEvent(new Event('change')); }
  });

  // ---------- Row builders ----------
  function applyRowData(row, data){
    if(!data) return;
    const iconSlot = row.querySelector('.icon-slot');
    if(data.icon){ iconSlot.style.backgroundImage = `url(${data.icon})`; iconSlot.classList.add('has-icon'); iconSlot.draggable = true; }
    if(data.t !== undefined) row.querySelector('.t').innerHTML = data.t;
    if(data.d !== undefined) row.querySelector('.d').innerHTML = data.d;
  }
  function addLegendRow(data){
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="swatch icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="legend-text"><div class="t" contenteditable="true" data-ph="Nom du symbole"></div><div class="d" contenteditable="true" data-ph="Description courte"></div></div>`;
    document.getElementById('legendRows').appendChild(row);
    applyRowData(row, data);
    return row;
  }
  function addFacRow(containerId, nameHint, detailHint, data){
    const row = document.createElement('div');
    row.className = 'fac-row';
    row.innerHTML = `<button class="row-remove" title="Supprimer">×</button>
      <div class="fac-icon icon-slot"><input type="file" class="icon-input" accept="image/*"></div>
      <div class="fac-text"><div class="t" contenteditable="true" data-ph="${nameHint}"></div><div class="d" contenteditable="true" data-ph="${detailHint}"></div></div>`;
    document.getElementById(containerId).appendChild(row);
    applyRowData(row, data);
    return row;
  }

  // ---------- Markers on the map ----------
  const mapLayer = document.getElementById('mapLayer');
  let suppressClick = false;
  let dragState = null;

  function makeMarker(leftPct, topPct, bgImage){
    const marker = document.createElement('div');
    marker.className = 'map-marker icon-slot' + (bgImage ? ' has-icon' : '');
    marker.style.left = leftPct + '%';
    marker.style.top = topPct + '%';
    if(bgImage){ marker.style.backgroundImage = bgImage; }
    marker.innerHTML = '<input type="file" class="icon-input" accept="image/*"><button class="row-remove" title="Supprimer">×</button>';
    mapLayer.appendChild(marker);
    return marker;
  }
  document.getElementById('addMarkerBtn').addEventListener('click', ()=> makeMarker(50, 50, null));

  document.addEventListener('pointerdown', e=>{
    const marker = e.target.closest('.map-marker');
    if(!marker || e.target.closest('.row-remove')) return;
    dragState = { marker, startX:e.clientX, startY:e.clientY, moved:false, rect: marker.closest('.sheet').getBoundingClientRect() };
  });
  document.addEventListener('pointermove', e=>{
    if(!dragState) return;
    const dx = e.clientX - dragState.startX, dy = e.clientY - dragState.startY;
    if(Math.abs(dx) > 4 || Math.abs(dy) > 4) dragState.moved = true;
    if(dragState.moved){
      const r = dragState.rect;
      let leftPct = Math.min(100, Math.max(0, ((e.clientX - r.left) / r.width) * 100));
      let topPct = Math.min(100, Math.max(0, ((e.clientY - r.top) / r.height) * 100));
      dragState.marker.style.left = leftPct + '%';
      dragState.marker.style.top = topPct + '%';
    }
  });
  document.addEventListener('pointerup', ()=>{
    if(dragState && dragState.moved){ suppressClick = true; setTimeout(()=> suppressClick = false, 0); }
    dragState = null;
  });

  document.addEventListener('dragstart', e=>{
    const iconSlot = e.target.closest('.icon-slot.has-icon');
    if(iconSlot){ e.dataTransfer.setData('text/plain', iconSlot.style.backgroundImage); }
  });
  mapLayer.addEventListener('dragover', e=> e.preventDefault());
  mapLayer.addEventListener('drop', e=>{
    e.preventDefault();
    const bg = e.dataTransfer.getData('text/plain');
    const rect = mapLayer.getBoundingClientRect();
    const leftPct = ((e.clientX - rect.left) / rect.width) * 100;
    const topPct = ((e.clientY - rect.top) / rect.height) * 100;
    if(bg && bg.startsWith('url(')){ makeMarker(leftPct, topPct, bg); return; }
    const file = e.dataTransfer.files[0];
    if(file){
      readImageFile(file, dataURL=> makeMarker(leftPct, topPct, `url(${dataURL})`));
    }
  });

  document.addEventListener('click', function(e){
    const panelClose = e.target.closest('.panel-close');
    if(panelClose){ togglePanel(panelClose.dataset.panel); return; }

    const panelToggle = e.target.closest('.panel-toggle');
    if(panelToggle){ togglePanel(panelToggle.dataset.panel); return; }

    const removeBtn = e.target.closest('.row-remove');
    if(removeBtn){ removeBtn.closest('.legend-row,.fac-row,.map-marker').remove(); return; }

    const iconSlot = e.target.closest('.icon-slot');
    if(iconSlot){
      if(suppressClick) return;
      iconSlot.querySelector('.icon-input').click();
      return;
    }

    const addBtn = e.target.closest('.add-row');
    if(addBtn){
      const type = addBtn.dataset.add;
      if(type==='legend') addLegendRow();
      if(type==='faction') addFacRow('factionRows', 'Royaume / Armée', 'Rôle sur le champ');
      if(type==='support') addFacRow('supportRows', 'Unité alliée', 'Détail');
    }
  });

  document.addEventListener('change', function(e){
    if(e.target.classList.contains('icon-input')){
      const file = e.target.files[0];
      if(!file) return;
      const iconSlot = e.target.closest('.icon-slot');
      readImageFile(file, dataURL=>{
        iconSlot.style.backgroundImage = `url(${dataURL})`;
        iconSlot.classList.add('has-icon');
        if(!iconSlot.classList.contains('map-marker')) iconSlot.draggable = true;
      });
    }
  });
  document.addEventListener('dragover', e=>{ if(e.target.closest('.icon-slot')) e.preventDefault(); });
  document.addEventListener('drop', e=>{
    const iconSlot = e.target.closest('.icon-slot');
    if(iconSlot && !iconSlot.classList.contains('map-marker')){
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if(file){
        const iconInput = iconSlot.querySelector('.icon-input');
        iconInput.files = e.dataTransfer.files;
        iconInput.dispatchEvent(new Event('change'));
      }
    }
  });

  // ---------- Panel visibility ----------
  function setPanelVisible(name, visible){
    const panel = document.querySelector('.' + name);
    if(!panel) return;
    panel.classList.toggle('panel-hidden', !visible);
    const btn = document.querySelector(`.panel-toggle[data-panel="${name}"]`);
    if(btn) btn.classList.toggle('off', !visible);
  }
  function togglePanel(name){
    const panel = document.querySelector('.' + name);
    if(!panel) return;
    setPanelVisible(name, panel.classList.contains('panel-hidden'));
  }

  // ---------- Font combos ----------
  const fontCombos = [
    { label:'Vieux Monde', display:'IM Fell English', body:'EB Garamond',        url:'https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap' },
    { label:'Chronique',   display:'Cinzel',           body:'Cormorant Garamond', url:'https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap' },
    { label:'Grimoire',    display:'MedievalSharp',    body:'EB Garamond',        url:'https://fonts.googleapis.com/css2?family=MedievalSharp&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap' },
    { label:'Royaume',     display:'Cormorant SC',     body:'Cormorant',          url:'https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Cormorant:ital,wght@0,400;0,600;1,400&display=swap' },
    { label:'Runique',     display:'Uncial Antiqua',   body:'EB Garamond',        url:'https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap' },
  ];
  const fontSelect = document.getElementById('fontSelect');
  fontCombos.forEach((c,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = c.label;
    fontSelect.appendChild(opt);
  });
  fontSelect.addEventListener('change', ()=>{
    const c = fontCombos[fontSelect.value];
    document.getElementById('fontLink').href = c.url;
    document.documentElement.style.setProperty('--font-display', `'${c.display}', serif`);
    document.documentElement.style.setProperty('--font-body', `'${c.body}', serif`);
  });

  // ---------- Colour palettes ----------
  const paletteCombos = [
    { label:'Vieux Monde', vars:{ '--parchment':'#d8c9a6', '--panel':'rgba(35,28,18,0.7)', '--ink':'#2a2119', '--ink-soft':'#4a3d2c', '--line':'rgba(60,45,25,0.4)', '--wax':'#7a2b26', '--olive':'#5c5f3a', '--gold':'#a9863f' } },
    { label:'Royaume Vert', vars:{ '--parchment':'#d3d9b8', '--panel':'rgba(22,30,18,0.7)', '--ink':'#202b1a', '--ink-soft':'#3c4a30', '--line':'rgba(50,70,35,0.4)', '--wax':'#3f5c2e', '--olive':'#4a5c2a', '--gold':'#8a9c4f' } },
    { label:'Sang et Acier', vars:{ '--parchment':'#c9b3a0', '--panel':'rgba(28,18,16,0.72)', '--ink':'#2a1a16', '--ink-soft':'#4a3028', '--line':'rgba(80,40,30,0.4)', '--wax':'#8a1f1f', '--olive':'#5c3a2a', '--gold':'#a95c3f' } },
    { label:'Glace et Os', vars:{ '--parchment':'#d8dde0', '--panel':'rgba(18,22,26,0.72)', '--ink':'#1c2226', '--ink-soft':'#33404a', '--line':'rgba(120,150,170,0.4)', '--wax':'#3d6b8a', '--olive':'#4a5c6b', '--gold':'#7fa9c9' } },
    { label:'Sable Doré', vars:{ '--parchment':'#e0c98a', '--panel':'rgba(32,24,12,0.7)', '--ink':'#2e2010', '--ink-soft':'#4f3a1c', '--line':'rgba(110,80,30,0.4)', '--wax':'#8a4a1f', '--olive':'#6b5228', '--gold':'#c98f3f' } },
  ];
  const paletteSelect = document.getElementById('paletteSelect');
  paletteCombos.forEach((p,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = p.label;
    paletteSelect.appendChild(opt);
  });
  paletteSelect.addEventListener('change', ()=>{
    const p = paletteCombos[paletteSelect.value];
    Object.entries(p.vars).forEach(([k,v])=> document.documentElement.style.setProperty(k, v));
  });

  // ---------- Export to PNG ----------
  async function exportPng(){
    const sheetEl = document.getElementById('sheet');
    sheetEl.classList.add('exporting');
    try{
      const canvas = await html2canvas(sheetEl, { backgroundColor: null, scale: 2 });
      canvas.toBlob(blob=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const rawTitle = (document.querySelector('header h1').innerText || 'carte-aof').trim();
        a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-aof') + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      });
    } catch(err){
      showToast("Erreur lors de l'export en image. Réessaie, ou utilise \"Imprimer / PDF\".");
    } finally {
      sheetEl.classList.remove('exporting');
    }
  }
  document.getElementById('exportPngBtn').addEventListener('click', exportPng);

  // ---------- Save / Load project ----------
  function urlFromBg(bg){
    if(!bg) return null;
    const m = bg.match(/^url\((['"]?)(.*)\1\)$/);
    return m ? m[2] : null;
  }
  function serializeRow(row){
    const iconSlot = row.querySelector('.icon-slot');
    return {
      icon: urlFromBg(iconSlot.style.backgroundImage),
      t: row.querySelector('.t').innerHTML,
      d: row.querySelector('.d').innerHTML
    };
  }
  function serializeMarker(marker){
    return {
      left: parseFloat(marker.style.left),
      top: parseFloat(marker.style.top),
      icon: urlFromBg(marker.style.backgroundImage)
    };
  }
  function saveProject(){
    const terrainImg = document.querySelector('.terrain-slot img');
    const state = {
      version: 1,
      template: 'aof',
      brand: document.querySelector('header .brand').innerHTML,
      title: document.querySelector('header h1').innerHTML,
      meta: document.querySelector('header .meta').innerHTML,
      terrain: terrainImg ? terrainImg.src : null,
      terrainScale: terrainScale,
      terrainOffsetX: terrainOffsetX,
      terrainOffsetY: terrainOffsetY,
      legendTitle: document.querySelector('.legend .panel-title').innerHTML,
      legend: Array.from(document.querySelectorAll('#legendRows .legend-row')).map(serializeRow),
      factionTitle: document.querySelector('.factions .panel-title').innerHTML,
      factions: Array.from(document.querySelectorAll('#factionRows .fac-row')).map(serializeRow),
      supportTitle: document.querySelector('.support .panel-title').innerHTML,
      support: Array.from(document.querySelectorAll('#supportRows .fac-row')).map(serializeRow),
      markers: Array.from(document.querySelectorAll('#mapLayer .map-marker')).map(serializeMarker),
      legendVisible: !document.querySelector('.legend').classList.contains('panel-hidden'),
      factionsVisible: !document.querySelector('.factions').classList.contains('panel-hidden'),
      supportVisible: !document.querySelector('.support').classList.contains('panel-hidden'),
      font: parseInt(fontSelect.value || 0),
      palette: parseInt(paletteSelect.value || 0)
    };
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const rawTitle = (document.querySelector('header h1').innerText || 'carte-projet-aof').trim();
    a.download = (rawTitle.replace(/\s+/g,'-').toLowerCase() || 'carte-projet-aof') + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function loadProject(state){
    document.querySelector('header .brand').innerHTML = state.brand || '';
    document.querySelector('header h1').innerHTML = state.title || '';
    document.querySelector('header .meta').innerHTML = state.meta || '';
    if(state.terrain){
      let img = document.querySelector('.terrain-slot img');
      if(!img){ img = document.createElement('img'); document.getElementById('terrainSlot').appendChild(img); }
      img.src = state.terrain;
      hint.style.display = 'none';
      terrainScale = typeof state.terrainScale === 'number' ? state.terrainScale : 1;
      terrainOffsetX = typeof state.terrainOffsetX === 'number' ? state.terrainOffsetX : 0;
      terrainOffsetY = typeof state.terrainOffsetY === 'number' ? state.terrainOffsetY : 0;
      terrainZoom.value = Math.round(terrainScale * 100);
      updateTerrainTransform();
    }
    if(state.legendTitle !== undefined) document.querySelector('.legend .panel-title').innerHTML = state.legendTitle;
    if(state.factionTitle !== undefined) document.querySelector('.factions .panel-title').innerHTML = state.factionTitle;
    if(state.supportTitle !== undefined) document.querySelector('.support .panel-title').innerHTML = state.supportTitle;

    document.getElementById('legendRows').innerHTML = '';
    (state.legend || []).forEach(d => addLegendRow(d));
    document.getElementById('factionRows').innerHTML = '';
    (state.factions || []).forEach(d => addFacRow('factionRows', 'Royaume / Armée', 'Rôle sur le champ', d));
    document.getElementById('supportRows').innerHTML = '';
    (state.support || []).forEach(d => addFacRow('supportRows', 'Unité alliée', 'Détail', d));

    document.getElementById('mapLayer').innerHTML = '';
    (state.markers || []).forEach(m => makeMarker(m.left, m.top, m.icon ? `url(${m.icon})` : null));

    setPanelVisible('legend', state.legendVisible !== false);
    setPanelVisible('factions', state.factionsVisible !== false);
    setPanelVisible('support', state.supportVisible !== false);

    if(typeof state.font === 'number' && fontCombos[state.font]){ fontSelect.value = state.font; fontSelect.dispatchEvent(new Event('change')); }
    if(typeof state.palette === 'number' && paletteCombos[state.palette]){ paletteSelect.value = state.palette; paletteSelect.dispatchEvent(new Event('change')); }
  }
  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
  document.getElementById('loadProjectInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ loadProject(JSON.parse(reader.result)); }
      catch(err){ alert('Fichier de projet invalide.'); }
      e.target.value = '';
    };
    reader.readAsText(file);
  });
</script>

</body>
